<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>TTD DEATH CIRCUIT // V5.2 CONTROL LIFT</title>
<style>
:root{--p:#ff2d95;--c:#39d7ff;--g:#8aff2b;--y:#ffe53b}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05030a;color:#fff;font-family:Arial,sans-serif;touch-action:none}
#shell{position:relative;width:100vw;height:100vh;overflow:hidden;background:#05030a}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#badge{position:absolute;z-index:4;left:12px;top:max(10px,env(safe-area-inset-top));padding:7px 10px;border:1px solid rgba(57,215,255,.45);background:rgba(0,0,0,.72);font:900 11px monospace;color:var(--c)}
#hud{position:absolute;z-index:4;right:12px;top:max(10px,env(safe-area-inset-top));display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:70vw}
.chip{padding:6px 8px;background:rgba(0,0,0,.72);border:1px solid rgba(255,45,149,.38);font:900 10px monospace;border-radius:9px}.chip b{color:var(--g)}
#controls{position:absolute;z-index:5;left:10px;right:10px;bottom:max(42px,calc(env(safe-area-inset-bottom) + 38px));display:grid;grid-template-columns:180px minmax(240px,1fr) 175px;gap:10px;align-items:end;pointer-events:none}
.ctrl{pointer-events:auto}.steer,.pedals{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{min-height:56px;border-radius:16px;border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.80);color:#fff;font-weight:900;font-size:16px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.35);touch-action:none;-webkit-tap-highlight-color:transparent}
button:active,.active{transform:translateY(2px);filter:brightness(1.35)}
#left,#right{color:var(--c);border-color:rgba(57,215,255,.5);font-size:25px}
#throttle{color:var(--g);border-color:rgba(138,255,43,.5)}
#brake{color:var(--p);border-color:rgba(255,45,149,.58)}
#start{color:var(--y);border-color:rgba(255,229,59,.55);width:100%}
#nitro{position:absolute;z-index:6;right:154px;bottom:max(118px,calc(env(safe-area-inset-bottom) + 114px));min-height:34px;padding:6px 10px;border-radius:11px;color:var(--g);border-color:rgba(138,255,43,.5);font:900 10px monospace}
#music{position:absolute;z-index:6;right:12px;bottom:max(118px,calc(env(safe-area-inset-bottom) + 114px));min-height:34px;padding:6px 10px;border-radius:11px;color:var(--c);border-color:rgba(57,215,255,.5);font:900 10px monospace}
@media(max-width:760px){#controls{grid-template-columns:112px 1fr 122px;gap:6px;bottom:max(54px,calc(env(safe-area-inset-bottom) + 50px))}button{min-height:50px;font-size:13px}#left,#right{font-size:21px}.chip{font-size:9px}#nitro{right:142px;bottom:max(120px,calc(env(safe-area-inset-bottom) + 116px))}#music{bottom:max(120px,calc(env(safe-area-inset-bottom) + 116px))}}
@media(max-height:860px) and (orientation:landscape){#controls{bottom:max(62px,calc(env(safe-area-inset-bottom) + 58px))}button{min-height:46px;font-size:12px}#left,#right{font-size:20px}#nitro,#music{bottom:max(126px,calc(env(safe-area-inset-bottom) + 122px))}}
@media(max-height:740px) and (orientation:landscape){#controls{bottom:max(72px,calc(env(safe-area-inset-bottom) + 68px))}button{min-height:42px;font-size:11px}#left,#right{font-size:18px}#nitro,#music{bottom:max(132px,calc(env(safe-area-inset-bottom) + 128px))}}
</style>
</head>
<body>
<div id="shell">
<canvas id="game"></canvas>
<div id="badge">TTD DEATH CIRCUIT // V5.2 CONTROL LIFT</div>
<div id="hud">
<div class="chip">SPD <b id="spd">0</b></div>
<div class="chip">GEAR <b id="gear">1</b></div>
<div class="chip">ROAD <b id="district">TITAN RUN</b></div>
<div class="chip">POS <b id="racepos">1/4</b></div>
<div class="chip">CHECK <b id="check">0/5</b></div>
<div class="chip">LAP <b id="lap">1/3</b></div>
<div class="chip">SCORE <b id="score">000000</b></div>
<div class="chip">NITRO <b id="nitroVal">100</b></div>
</div>
<div id="controls">
  <div class="ctrl steer"><button id="left">◀</button><button id="right">▶</button></div>
  <div class="ctrl pedals"><button id="brake">BRAKE / DRIFT</button><button id="throttle">THROTTLE</button></div>
  <div class="ctrl"><button id="start">START / RESET</button></div>
</div>
<button id="nitro">⚡ NITRO</button><button id="music">♫ SYNTH OFF</button>
</div>
<script>
(()=>{
'use strict';

const CDN='https://raw.githack.com/Hardcase87/ttd-hq/main/';
const c=document.getElementById('game'),ctx=c.getContext('2d');
let W=0,H=0,dpr=1;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=Math.floor(W*dpr);c.height=Math.floor(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize,{passive:true});resize();

function img(src){const i=new Image();i.crossOrigin='anonymous';i.src=CDN+src;return i}
const bg=img('assets/background-view-1.png');
const concept=img('assets/death-circuit-concept.png');
const playerIdle=img('assets/death-circuit-v5/mayhem-rear-idle.png');
const playerBoost=img('assets/death-circuit-v5/mayhem-rear-boost.png');
const rivalImgs=[
 img('assets/death-circuit-v5/enforcer.png'),
 img('assets/death-circuit-v5/neon-runner.png'),
 img('assets/death-circuit-v5/military-interceptor.png')
];
const trafficImgs=[
 img('assets/death-circuit-v5/credit-viper.png'),
 img('assets/death-circuit-v5/nutri-haul.png'),
 img('assets/death-circuit-v5/alien-drifter.png')
];

const input={left:0,right:0,gas:0,brake:0};
const state={mode:'title',speed:0,pos:0,x:0,last:performance.now(),time:0,score:0,checkpoints:0,lap:1,nitro:100,nitroOn:false,combo:1,crash:0,flash:0,finish:false,districtIndex:0};

const DISTRICTS=['TITAN RUN','VHS QUARTER','FINANCIAL DISTRICT','NUTRITION DISTRICT','MILITARY ZONE','TITAN HEIGHTS'];
const SIGNS=[
 {brand:'SKULL JUICE',copy:"IT'S NOT JUICE. IT'S A WARNING.",c:'#8aff2b'},
 {brand:'TTD',copy:'BRAKES ARE A PERSONAL FAILURE.',c:'#ff2d95'},
 {brand:'TITAN BABE',copy:'STRONG. SEXY. DANGEROUS.',c:'#ff2d95'},
 {brand:'MORTIS',copy:'YOUR CRASH HAS BEEN APPROVED.',c:'#39d7ff'}
];

const ROAD={segments:[],segLen:180,drawDistance:104};
function addRoad(n,curve=0){const start=ROAD.segments.length;for(let i=0;i<n;i++){const t=i/Math.max(1,n-1);ROAD.segments.push({curve:curve*Math.sin(Math.PI*t),stripe:(start+i)%2})}}
addRoad(55);addRoad(60,.62);addRoad(45,-.38);addRoad(65,-.78);addRoad(55,.46);addRoad(75);addRoad(55,.68);addRoad(55,-.52);
const TRACK_LEN=()=>ROAD.segments.length*ROAD.segLen;
function segAt(z){return ROAD.segments[Math.floor(z/ROAD.segLen)%ROAD.segments.length]}

const rivals=[],traffic=[],checkpoints=[];
function seedRaceObjects(){
 rivals.length=0;traffic.length=0;checkpoints.length=0;
 const total=TRACK_LEN();
 for(let i=0;i<5;i++)checkpoints.push({z:total*(i+1)/6,passed:false});
 for(let i=0;i<3;i++)rivals.push({z:1200+i*2150,lane:[-.42,.38,0][i],speed:184+i*17,hp:100,phase:i*1.11,alive:true,color:['#ff2d95','#39d7ff','#ffe53b'][i]});
 for(let i=0;i<6;i++)traffic.push({z:850+i*1650,lane:[-.58,.55,-.18,.22,-.48,.46][i],speed:102+(i%3)*20,kind:i%3,alive:true});
}
function wrapDist(z){const total=TRACK_LEN();let d=z-state.pos;while(d<0)d+=total;while(d>=total)d-=total;return d}

function roadProfile(horizon,bottom,curve){
 const v=state.speed/285;
 return{
  center:p=>W/2+curve*W*.49*(.20+.80*v)*(p*p*(1.35-.35*p))-state.x*W*.105*p,
  half:p=>W*(.03+.47*p)
 }
}

function drawBackground(){
 if(bg.complete&&bg.naturalWidth){
   const bh=H*.50,bw=W*1.02,bx=(W-bw)/2-state.x*W*.012;
   ctx.save();ctx.globalAlpha=.88;ctx.drawImage(bg,bx,0,bw,bh);ctx.restore();
   const fade=ctx.createLinearGradient(0,H*.28,0,H*.52);
   fade.addColorStop(0,'rgba(5,3,10,0)');fade.addColorStop(1,'rgba(5,3,10,.72)');
   ctx.fillStyle=fade;ctx.fillRect(0,H*.28,W,H*.26);
 }else{
   const sky=ctx.createLinearGradient(0,0,0,H*.5);sky.addColorStop(0,'#13042b');sky.addColorStop(.52,'#7f145d');sky.addColorStop(1,'#ff7a55');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H*.5)
 }
}

function drawRoad(horizon,bottom,curve){
 const prof=roadProfile(horizon,bottom,curve);
 const g=ctx.createLinearGradient(0,horizon,0,H);g.addColorStop(0,'#110817');g.addColorStop(1,'#05040a');ctx.fillStyle=g;ctx.fillRect(0,horizon,W,H-horizon);
 const strips=64;
 for(let i=0;i<strips;i++){
  const p1=(i/strips)**2,p2=((i+1)/strips)**2;
  const y1=horizon+(bottom-horizon)*p1,y2=horizon+(bottom-horizon)*p2;
  const c1=prof.center(p1),c2=prof.center(p2),h1=prof.half(p1),h2=prof.half(p2);
  ctx.fillStyle=(i%2)?'#141018':'#1b151f';
  ctx.beginPath();ctx.moveTo(c1-h1,y1);ctx.lineTo(c1+h1,y1);ctx.lineTo(c2+h2,y2);ctx.lineTo(c2-h2,y2);ctx.closePath();ctx.fill();
  ctx.lineWidth=Math.max(1,1+p2*4);ctx.strokeStyle=(i%2)?'#39d7ff':'#ff2d95';
  ctx.beginPath();ctx.moveTo(c1-h1,y1);ctx.lineTo(c2-h2,y2);ctx.moveTo(c1+h1,y1);ctx.lineTo(c2+h2,y2);ctx.stroke();
  if(((i+Math.floor(state.pos/80))%7)<3){
    const mw1=Math.max(1,h1*.012),mw2=Math.max(1,h2*.012);ctx.fillStyle='#ffe53b';
    ctx.beginPath();ctx.moveTo(c1-mw1,y1);ctx.lineTo(c1+mw1,y1);ctx.lineTo(c2+mw2,y2);ctx.lineTo(c2-mw2,y2);ctx.closePath();ctx.fill()
  }
 }
}

function drawSparseRails(horizon,bottom,curve){
 const prof=roadProfile(horizon,bottom,curve);
 for(let i=12;i<58;i+=8){
  const p=(i/58)**2,y=horizon+(bottom-horizon)*p,c=prof.center(p),h=prof.half(p),post=8+36*p;
  ctx.strokeStyle=i%16===0?'#ff2d95':'#39d7ff';ctx.lineWidth=Math.max(1,1+2*p);
  for(const side of [-1,1]){const x=c+side*h*1.10;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y-post);ctx.stroke()}
 }
}

function drawSigns(horizon,bottom,curve){
 const prof=roadProfile(horizon,bottom,curve),spacing=2100,base=Math.floor(state.pos/spacing);
 for(let k=0;k<2;k++){
  const idx=base+k;let dist=idx*spacing-state.pos;while(dist<0)dist+=spacing*8;if(dist>spacing*1.75)continue;
  const depth=1-dist/(spacing*1.75),p=.11+.89*depth*depth,side=(idx%2)?1:-1,y=horizon+(bottom-horizon)*p,c=prof.center(p),h=prof.half(p),x=c+side*h*1.27,sc=.26+.62*p;
  const s=SIGNS[idx%SIGNS.length],sw=190*sc,sh=70*sc;
  ctx.save();ctx.translate(x,y-sh*.75);ctx.fillStyle='rgba(4,4,10,.92)';ctx.strokeStyle=s.c;ctx.lineWidth=Math.max(1,2*sc);ctx.fillRect(-sw/2,-sh/2,sw,sh);ctx.strokeRect(-sw/2,-sh/2,sw,sh);
  ctx.textAlign='center';ctx.fillStyle=s.c;ctx.font=`900 ${Math.max(8,16*sc)}px monospace`;ctx.fillText(s.brand,0,-5*sc);ctx.fillStyle='#fff';ctx.font=`900 ${Math.max(5,8*sc)}px monospace`;ctx.fillText(s.copy,0,13*sc);ctx.restore()
 }
}

function drawObjectCar(x,y,scale,img,color){
 ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);
 ctx.globalAlpha=.20;ctx.fillStyle='#000';ctx.beginPath();ctx.ellipse(0,18,42,10,0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
 if(img&&img.complete&&img.naturalWidth){const w=108,h=w*(img.naturalHeight/img.naturalWidth);ctx.shadowColor=color;ctx.shadowBlur=5;ctx.drawImage(img,-w/2,-h*.76,w,h)}
 ctx.restore()
}

function drawTraffic(horizon,bottom,curve){
 const prof=roadProfile(horizon,bottom,curve),maxD=3600,list=[];
 for(const t of traffic){if(t.alive){const d=wrapDist(t.z);if(d<maxD)list.push({o:t,d,type:'traffic'})}}
 for(const r of rivals){if(r.alive){const d=wrapDist(r.z);if(d<maxD)list.push({o:r,d,type:'rival'})}}
 list.sort((a,b)=>b.d-a.d);
 for(const it of list){
  const depth=1-it.d/maxD,p=.08+.92*depth*depth,y=horizon+(bottom-horizon)*p,c=prof.center(p),h=prof.half(p),x=c+it.o.lane*h*.69,sc=.20+.94*p;
  const im=it.type==='rival'?rivalImgs[(it.o.phase*10|0)%rivalImgs.length]:trafficImgs[(it.o.kind||0)%trafficImgs.length];
  drawObjectCar(x,y,sc,im,it.type==='rival'?it.o.color:'#666')
 }
}

function drawCheckpoint(horizon,bottom,curve){
 const next=checkpoints.find(x=>!x.passed);if(!next)return;const d=wrapDist(next.z);if(d>3600)return;
 const depth=1-d/3600,p=.08+.92*depth*depth;if(p<.16)return;
 const prof=roadProfile(horizon,bottom,curve),y=horizon+(bottom-horizon)*p,c=prof.center(p),h=prof.half(p),sw=h*1.35;
 ctx.strokeStyle='#ffe53b';ctx.lineWidth=Math.max(2,4*p);ctx.beginPath();ctx.moveTo(c-sw/2,y);ctx.lineTo(c+sw/2,y);ctx.stroke()
}

function drawCar(){
 const x=W/2+state.x*W*.16,y=H*.81,steer=input.right-input.left,s=Math.max(.72,Math.min(.96,W/1450));
 ctx.save();ctx.translate(x,y);ctx.rotate(steer*.045);
 ctx.globalAlpha=.28;ctx.fillStyle='#000';ctx.beginPath();ctx.ellipse(0,39,132,27,0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
 const source=(state.nitroOn&&state.nitro>0)?playerBoost:playerIdle;
 if(source.complete&&source.naturalWidth){const w=(state.nitroOn?350:334)*s,h=w*(source.naturalHeight/source.naturalWidth);ctx.shadowColor=state.nitroOn?'#ff2d95':'#39d7ff';ctx.shadowBlur=state.nitroOn?18:9;ctx.drawImage(source,-w/2+steer*8,-h*.77,w,h)}
 ctx.restore()
}

function updateRaceObjects(dt){
 const total=TRACK_LEN();
 for(const t of traffic){if(t.alive)t.z=(t.z+t.speed*dt*4.15)%total}
 for(const r of rivals){if(r.alive){r.z=(r.z+r.speed*dt*4.15)%total;r.lane+=Math.sin(state.time*.65+r.phase)*dt*.018;r.lane=Math.max(-.72,Math.min(.72,r.lane))}}
 for(const cp of checkpoints){
  if(cp.passed)continue;const d=wrapDist(cp.z);
  if(d<145&&state.speed>40){cp.passed=true;state.checkpoints++;state.score+=2500*state.combo;state.combo=Math.min(6,state.combo+1);state.flash=.25;
   if(state.checkpoints>=5){state.lap++;if(state.lap>3){state.finish=true;state.mode='finish'}else{state.checkpoints=0;checkpoints.forEach(c=>c.passed=false)}}}
 }
 const playerLane=state.x/1.45*.78;
 for(const t of traffic){
  if(!t.alive)continue;const d=wrapDist(t.z),lat=Math.abs(t.lane-playerLane);
  if(d<90&&lat<.20){if(state.nitroOn&&state.speed>220){t.alive=false;state.score+=900*state.combo}else{state.speed*=.64;state.crash=.38;state.combo=1;t.z=(t.z+700)%total}}
 }
 let ahead=0;for(const r of rivals){if(r.alive&&wrapDist(r.z)<TRACK_LEN()/2)ahead++}
 document.getElementById('racepos').textContent=`${Math.min(4,ahead+1)}/4`;
}

function updateDistrict(){const p=(state.pos%TRACK_LEN())/TRACK_LEN();state.districtIndex=Math.min(DISTRICTS.length-1,Math.floor(p*DISTRICTS.length));document.getElementById('district').textContent=DISTRICTS[state.districtIndex]}

function update(dt){
 state.time+=dt;state.crash=Math.max(0,state.crash-dt);state.flash=Math.max(0,state.flash-dt);
 if(state.mode!=='play')return;
 const nitroBoost=state.nitroOn&&state.nitro>0,accel=input.gas?(nitroBoost?148:94):0,brake=input.brake?185:0;
 state.speed+=(accel-brake-18)*dt;state.speed=Math.max(0,Math.min(285,state.speed));
 if(nitroBoost){state.nitro=Math.max(0,state.nitro-28*dt);state.score+=18*dt;if(state.nitro<=0)state.nitroOn=false}else state.nitro=Math.min(100,state.nitro+5.5*dt);
 const steer=input.right-input.left;state.x+=steer*(input.brake?.020:.011)*(state.speed/120+.35);state.x*=Math.pow(.992,dt*60);state.x=Math.max(-1.45,Math.min(1.45,state.x));
 const seg=segAt(state.pos);state.x-=seg.curve*(state.speed/285)*dt*.48;state.pos=(state.pos+state.speed*dt*5.3)%TRACK_LEN();
 updateRaceObjects(dt);updateDistrict();state.score+=state.speed*dt*.14*state.combo;
 document.getElementById('spd').textContent=Math.round(state.speed);document.getElementById('gear').textContent=Math.max(1,Math.min(6,Math.floor(state.speed/48)+1));
}

function drawWorld(){
 const horizon=H*.47,bottom=H*1.03;drawBackground();
 const seg=segAt(state.pos),next=segAt(state.pos+ROAD.segLen*10),curve=seg.curve*.72+next.curve*.28;
 drawRoad(horizon,bottom,curve);drawSparseRails(horizon,bottom,curve);drawCheckpoint(horizon,bottom,curve);drawTraffic(horizon,bottom,curve);drawSigns(horizon,bottom,curve);
}

function drawHUD(){
 document.getElementById('check').textContent=`${state.checkpoints}/5`;document.getElementById('lap').textContent=`${Math.min(state.lap,3)}/3`;document.getElementById('score').textContent=String(Math.round(state.score)).padStart(6,'0');document.getElementById('nitroVal').textContent=Math.round(state.nitro);
 if(state.finish){ctx.fillStyle='rgba(0,0,0,.68)';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.fillStyle='#8aff2b';ctx.font=`900 ${Math.max(42,W*.05)}px Impact,Arial Black`;ctx.fillText('MAX DAMAGE COMPLETE',W/2,H*.42);ctx.fillStyle='#ff2d95';ctx.font='900 20px monospace';ctx.fillText(`SCORE ${String(Math.round(state.score)).padStart(6,'0')}`,W/2,H*.49)}
}

function render(){
 ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
 if(state.mode==='title'){
  if(concept.complete&&concept.naturalWidth)ctx.drawImage(concept,0,0,W,H);else{ctx.fillStyle='#13042b';ctx.fillRect(0,0,W,H)}
  ctx.fillStyle='rgba(0,0,0,.52)';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.fillStyle='#ff2d95';ctx.font=`900 ${Math.max(42,Math.min(84,W*.07))}px Impact,Arial Black`;ctx.fillText('TTD DEATH CIRCUIT',W/2,H*.23);
  ctx.fillStyle='#39d7ff';ctx.font='900 19px monospace';ctx.fillText('V5.2 CONTROL LIFT',W/2,H*.29);ctx.fillStyle='#ffe53b';ctx.font='900 15px monospace';ctx.fillText('RAISED UI // IPAD PLAYABLE',W/2,H*.35);ctx.textAlign='left';return
 }
 drawWorld();drawCar();drawHUD();if(state.crash>0){ctx.fillStyle=`rgba(255,45,149,${state.crash*.18})`;ctx.fillRect(0,0,W,H)}if(state.flash>0){ctx.fillStyle=`rgba(255,229,59,${state.flash*.16})`;ctx.fillRect(0,0,W,H)}
}
function loop(now){const dt=Math.min(.033,(now-state.last)/1000||0);state.last=now;update(dt);render();requestAnimationFrame(loop)}

function hold(id,key){const el=document.getElementById(id),off=()=>{input[key]=0;el.classList.remove('active')};el.addEventListener('pointerdown',e=>{e.preventDefault();input[key]=1;el.classList.add('active');try{el.setPointerCapture(e.pointerId)}catch(_){}});['pointerup','pointercancel','lostpointercapture'].forEach(t=>el.addEventListener(t,off))}
hold('left','left');hold('right','right');hold('throttle','gas');hold('brake','brake');
document.getElementById('start').addEventListener('pointerdown',e=>{e.preventDefault();Object.assign(state,{mode:'play',speed:0,pos:0,x:0,score:0,checkpoints:0,lap:1,nitro:100,combo:1,finish:false});seedRaceObjects()});
const nitroBtn=document.getElementById('nitro'),nitroOff=()=>{state.nitroOn=false;nitroBtn.classList.remove('active')};
nitroBtn.addEventListener('pointerdown',e=>{e.preventDefault();if(state.mode==='play'&&state.nitro>0){state.nitroOn=true;nitroBtn.classList.add('active');try{nitroBtn.setPointerCapture(e.pointerId)}catch(_){}}});['pointerup','pointercancel','lostpointercapture'].forEach(t=>nitroBtn.addEventListener(t,nitroOff));
['contextmenu','selectstart','dragstart','dblclick','gesturestart'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));

addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code))e.preventDefault();if(e.code==='ArrowLeft'||e.code==='KeyA')input.left=1;if(e.code==='ArrowRight'||e.code==='KeyD')input.right=1;if(e.code==='ArrowUp'||e.code==='KeyW')input.gas=1;if(e.code==='ArrowDown'||e.code==='KeyS'||e.code==='Space')input.brake=1;if(e.code==='ShiftLeft'||e.code==='KeyN')state.nitroOn=true;if(e.code==='Enter'){state.mode='play';seedRaceObjects()}});
addEventListener('keyup',e=>{if(e.code==='ArrowLeft'||e.code==='KeyA')input.left=0;if(e.code==='ArrowRight'||e.code==='KeyD')input.right=0;if(e.code==='ArrowUp'||e.code==='KeyW')input.gas=0;if(e.code==='ArrowDown'||e.code==='KeyS'||e.code==='Space')input.brake=0;if(e.code==='ShiftLeft'||e.code==='KeyN')state.nitroOn=false});

let audioCtx=null,musicOn=false,musicTimer=null,musicStep=0;
function musicStart(){if(musicOn)return;audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();musicOn=true;document.getElementById('music').textContent='♫ SYNTH ON';const bass=[36,36,43,36,48,43,36,34],lead=[60,63,67,70,67,63,58,55];const tick=()=>{if(!musicOn)return;const now=audioCtx.currentTime,hz=n=>440*Math.pow(2,(n-69)/12),mk=(f,type,dur,gain)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(gain,now+.012);g.gain.exponentialRampToValueAtTime(.0001,now+dur);o.connect(g);g.connect(audioCtx.destination);o.start(now);o.stop(now+dur+.03)};mk(hz(bass[musicStep%bass.length]),'sawtooth',.19,.025);if(musicStep%2===0)mk(hz(lead[(musicStep/2)%lead.length]),'square',.12,.009);musicStep++;musicTimer=setTimeout(tick,150)};tick()}
function musicStop(){musicOn=false;if(musicTimer)clearTimeout(musicTimer);musicTimer=null;document.getElementById('music').textContent='♫ SYNTH OFF'}
document.getElementById('music').addEventListener('pointerdown',e=>{e.preventDefault();musicOn?musicStop():musicStart()});

seedRaceObjects();requestAnimationFrame(loop);
})();
</script>
