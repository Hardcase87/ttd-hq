<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>TTD DEATH CIRCUIT // PROTOTYPE V3</title>
<style>
:root{--p:#ff2d95;--c:#39d7ff;--g:#8aff2b;--y:#ffe53b}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05030a;color:#fff;font-family:Arial,sans-serif;touch-action:none}
#shell{position:relative;width:100vw;height:100vh;overflow:hidden;background:#05030a}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#badge{position:absolute;z-index:4;left:12px;top:max(10px,env(safe-area-inset-top));padding:8px 11px;border:1px solid rgba(57,215,255,.5);background:rgba(0,0,0,.65);font:900 12px monospace;color:var(--c)}
#hud{position:absolute;z-index:4;right:12px;top:max(10px,env(safe-area-inset-top));display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;max-width:65vw}
.chip{padding:7px 9px;background:rgba(0,0,0,.68);border:1px solid rgba(255,45,149,.45);font:900 11px monospace;border-radius:10px}
.chip b{color:var(--g)}
#controls{position:absolute;z-index:5;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));display:grid;grid-template-columns:150px minmax(220px,1fr) 170px;gap:10px;align-items:end;pointer-events:none}
.ctrl{pointer-events:auto}.steer,.pedals{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{min-height:66px;border-radius:18px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.76);color:#fff;font-weight:900;font-size:18px;box-shadow:inset 0 -5px 0 rgba(0,0,0,.35);touch-action:none;-webkit-tap-highlight-color:transparent}
button:active,.active{transform:translateY(2px);filter:brightness(1.4)}
#left,#right{color:var(--c);border-color:rgba(57,215,255,.55);font-size:28px}
#throttle{color:var(--g);border-color:rgba(138,255,43,.55)}
#brake{color:var(--p);border-color:rgba(255,45,149,.65)}
#start{color:var(--y);border-color:rgba(255,229,59,.6);width:100%}
#music{position:absolute;z-index:6;right:12px;bottom:94px;min-height:38px;padding:8px 12px;border-radius:12px;color:var(--c);border-color:rgba(57,215,255,.55);font:900 11px monospace}
@media(max-width:760px){#controls{grid-template-columns:120px 1fr 130px;gap:6px}button{min-height:58px;font-size:15px}#left,#right{font-size:24px}.chip{font-size:9px}}
</style>
</head>
<body>
<div id="shell">
<canvas id="game"></canvas>
<div id="badge">TTD DEATH CIRCUIT // PROTOTYPE V3</div>
<div id="hud"><div class="chip">SPD <b id="spd">0</b></div><div class="chip">GEAR <b id="gear">1</b></div><div class="chip">ROAD <b>TITAN RUN</b></div></div>
<div id="controls">
  <div class="ctrl steer"><button id="left">◀</button><button id="right">▶</button></div>
  <div class="ctrl pedals"><button id="brake">BRAKE / DRIFT</button><button id="throttle">THROTTLE</button></div>
  <div class="ctrl"><button id="start">START / RESET</button></div>
</div>
<button id="music">♫ SYNTH OFF</button>
</div>
<script>
(()=>{
'use strict';
const c=document.getElementById('game'),ctx=c.getContext('2d');
let W=0,H=0,dpr=1;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=Math.floor(W*dpr);c.height=Math.floor(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize,{passive:true});resize();
const concept=new Image();concept.src='assets/death-circuit-concept.png';
const bg1=new Image();bg1.src='assets/background-view-1.png';
const carImg=new Image();carImg.src='assets/mayhem-car-rear.png';
const input={left:0,right:0,gas:0,brake:0};
const state={mode:'title',speed:0,pos:0,x:0,last:performance.now(),time:0};
const SIGNS=[
 {brand:'SKULL JUICE',copy:'MORE FUEL. LESS RULES.',c:'#ff2d95'},
 {brand:'TBN MEDIA',copy:'WE OWN THE SKY.',c:'#39d7ff'},
 {brand:'TDI',copy:'PROGRESS REQUIRES DAMAGE.',c:'#8aff2b'},
 {brand:'TITAN BABE',copy:'LIFT HEAVY. DRIVE WORSE.',c:'#ff2d95'},
 {brand:'POWER AUTHORITY',copy:'LEG DAY IS MANDATORY.',c:'#ffe53b'},
 {brand:'TTD',copy:'DRIVE FASTER, MUTANT.',c:'#8aff2b'},
 {brand:'TTD',copy:'BRAKES ARE A PERSONAL FAILURE.',c:'#ff2d95'},
 {brand:'TTD',copy:'1ST TRY IS LAST TRY.',c:'#ffe53b'},
 {brand:'MORTIS COMPLIANCE',copy:'YOUR CRASH HAS BEEN APPROVED.',c:'#39d7ff'},
 {brand:'TITAN CITY',copy:'NO REFUNDS AFTER IMPACT.',c:'#ff2d95'}
];

const ROAD={segments:[],segLen:180,roadWidth:2100,cameraHeight:900,cameraDepth:1.15,drawDistance:170};
function addRoad(n,curve=0,hill=0){const start=ROAD.segments.length;for(let i=0;i<n;i++){const t=i/Math.max(1,n-1);ROAD.segments.push({curve:curve*Math.sin(Math.PI*t),hill:hill*Math.sin(Math.PI*t),stripe:(start+i)%2})}}
addRoad(45);addRoad(50,.75,.08);addRoad(35,-.45,-.03);addRoad(60,-.95,.06);addRoad(45,.55,-.05);addRoad(70,0,.02);addRoad(55,.85,.03);addRoad(55,-.65,-.03);
function segAt(z){return ROAD.segments[Math.floor(z/ROAD.segLen)%ROAD.segments.length]}
function project(worldX,worldY,worldZ,cameraX,cameraY,cameraZ){const dz=worldZ-cameraZ,scale=ROAD.cameraDepth/Math.max(1,dz);return{scale,x:W/2+scale*(worldX-cameraX)*W/2,y:H/2-scale*(worldY-cameraY)*H/2}}
function drawCar(){
 const x=W/2+state.x*W*.20,y=H*.80,s=Math.max(.66,Math.min(.98,W/1450));
 ctx.save();ctx.translate(x,y);
 ctx.globalAlpha=.30;ctx.fillStyle='#000';ctx.beginPath();ctx.ellipse(0,38,122,30,0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
 if(carImg.complete&&carImg.naturalWidth){
   const sx=0,sy=Math.floor(carImg.naturalHeight*.16),sw=carImg.naturalWidth,sh=Math.floor(carImg.naturalHeight*.84);
   const w=354*s,h=w*(sh/sw);
   ctx.shadowColor='#ff2d95';ctx.shadowBlur=22;
   ctx.drawImage(carImg,sx,sy,sw,sh,-w/2,-h*.76,w,h);
   ctx.shadowBlur=0;
 }else{
   ctx.fillStyle='#11131a';ctx.strokeStyle='#ff2d95';ctx.lineWidth=4;
   ctx.beginPath();ctx.moveTo(-105,28);ctx.lineTo(-88,-22);ctx.lineTo(-58,-48);ctx.lineTo(58,-48);ctx.lineTo(88,-22);ctx.lineTo(105,28);ctx.lineTo(70,46);ctx.lineTo(-70,46);ctx.closePath();ctx.fill();ctx.stroke();
 }
 if(input.gas&&state.speed>40){
   const len=20+Math.sin(state.time*30)*7+(state.speed/285)*24;
   ctx.fillStyle='#39d7ff';ctx.shadowColor='#39d7ff';ctx.shadowBlur=18;
   for(const ex of [-54,54]){ctx.beginPath();ctx.moveTo(ex,28);ctx.lineTo(ex-10,28+len);ctx.lineTo(ex+10,28);ctx.fill()}
   ctx.shadowBlur=0;
 }
 ctx.restore();
}

function drawAtmosphere(horizon){
 const v=state.speed/285;
 const haze=ctx.createLinearGradient(0,horizon-H*.08,0,horizon+H*.16);
 haze.addColorStop(0,'rgba(255,45,149,0)');
 haze.addColorStop(.45,`rgba(255,45,149,${.05+.08*v})`);
 haze.addColorStop(1,'rgba(57,215,255,0)');
 ctx.fillStyle=haze;ctx.fillRect(0,horizon-H*.08,W,H*.24);
 if(state.speed>120){
   const count=Math.floor(10+26*v);
   ctx.save();ctx.globalAlpha=.10+.18*v;ctx.lineWidth=1+2*v;
   for(let i=0;i<count;i++){
     const seed=(i*97+Math.floor(state.time*18)*13)%997;
     const side=(i%2)?1:-1;
     const y=horizon+((seed%100)/100)*(H-horizon);
     const x=W/2+side*(W*.30+(seed%37)/37*W*.28);
     ctx.strokeStyle=(i%3)?'#39d7ff':'#ff2d95';
     ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+side*(18+70*v),y+6+24*v);ctx.stroke();
   }
   ctx.restore();
 }
}
function drawSigns(horizon,curve){
 const spacing=1150,base=Math.floor(state.pos/spacing);
 for(let k=0;k<5;k++){
   const idx=base+k;
   const dist=((idx*spacing-state.pos)+spacing*20)%(spacing*20);
   if(dist>spacing*4.8)continue;
   const depth=1-Math.min(1,dist/(spacing*4.8));
   const p=.05+.95*depth*depth,side=(idx%2)?1:-1;
   const roadHalf=W*(.025+.47*p);
   const bend=curve*W*.46*(.30+.70*state.speed/285)*p*p;
   const cx=W/2+bend-state.x*W*.12*p;
   const x=cx+side*roadHalf*1.18,y=horizon+(H*1.02-horizon)*p;
   const sc=.30+.85*p,sign=SIGNS[((idx%SIGNS.length)+SIGNS.length)%SIGNS.length];
   const sw=Math.min(260,190*sc),sh=74*sc;
   ctx.save();ctx.translate(x,y-sh);
   ctx.shadowColor=sign.c;ctx.shadowBlur=12*sc;
   ctx.fillStyle='rgba(3,3,8,.88)';ctx.strokeStyle=sign.c;ctx.lineWidth=Math.max(1,2*sc);
   ctx.fillRect(-sw/2,-sh/2,sw,sh);ctx.strokeRect(-sw/2,-sh/2,sw,sh);
   ctx.shadowBlur=0;ctx.textAlign='center';ctx.fillStyle=sign.c;
   ctx.font=`900 ${Math.max(8,17*sc)}px monospace`;ctx.fillText(sign.brand,0,-5*sc);
   ctx.fillStyle='#fff';ctx.font=`900 ${Math.max(6,9*sc)}px monospace`;ctx.fillText(sign.copy,0,14*sc);
   ctx.strokeStyle='#777';ctx.lineWidth=Math.max(1,3*sc);ctx.beginPath();ctx.moveTo(0,sh/2);ctx.lineTo(0,sh*.95);ctx.stroke();
   ctx.restore();
 }
}

function drawWorld(){
 const horizon=H*.50,bottom=H*1.02;
 if(bg1.complete&&bg1.naturalWidth){const bw=W*1.10,bh=H*.58,bx=(W-bw)/2-state.x*W*.025;ctx.drawImage(bg1,bx,0,bw,bh);}else{const sky=ctx.createLinearGradient(0,0,0,H*.58);sky.addColorStop(0,'#13042b');sky.addColorStop(.4,'#7f145d');sky.addColorStop(1,'#ff7a55');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H*.58);}
 const seg=segAt(state.pos),next=segAt(state.pos+ROAD.segLen*10),curve=seg.curve*.72+next.curve*.28,bend=curve*W*.46*(.30+.70*state.speed/285);
 const ground=ctx.createLinearGradient(0,horizon,0,H);ground.addColorStop(0,'#16091d');ground.addColorStop(1,'#05040a');ctx.fillStyle=ground;ctx.fillRect(0,horizon,W,H-horizon);
 const strips=72;
 for(let i=0;i<strips;i++){const t1=i/strips,t2=(i+1)/strips,p1=t1*t1,p2=t2*t2,y1=horizon+(bottom-horizon)*p1,y2=horizon+(bottom-horizon)*p2;const turn1=bend*(p1*p1*(1.35-.35*p1)),turn2=bend*(p2*p2*(1.35-.35*p2));const c1=W/2+turn1-state.x*W*.12*p1,c2=W/2+turn2-state.x*W*.12*p2;const h1=W*(.025+.47*p1),h2=W*(.025+.47*p2);
  ctx.fillStyle=(i%2)?'#120817':'#1b0b22';ctx.beginPath();ctx.moveTo(c1-h1*1.12,y1);ctx.lineTo(c1+h1*1.12,y1);ctx.lineTo(c2+h2*1.12,y2);ctx.lineTo(c2-h2*1.12,y2);ctx.fill();
  ctx.fillStyle=(i%2)?'#18131f':'#211827';ctx.beginPath();ctx.moveTo(c1-h1,y1);ctx.lineTo(c1+h1,y1);ctx.lineTo(c2+h2,y2);ctx.lineTo(c2-h2,y2);ctx.fill();
  ctx.lineWidth=Math.max(1,1+p2*5);ctx.strokeStyle=(i%2)?'#ff2d95':'#39d7ff';ctx.beginPath();ctx.moveTo(c1-h1,y1);ctx.lineTo(c2-h2,y2);ctx.moveTo(c1+h1,y1);ctx.lineTo(c2+h2,y2);ctx.stroke();
  if(((i+Math.floor(state.pos/75))%6)<3){const mw1=Math.max(1,h1*.025),mw2=Math.max(1,h2*.025);ctx.fillStyle='#ffe53b';ctx.beginPath();ctx.moveTo(c1-mw1,y1);ctx.lineTo(c1+mw1,y1);ctx.lineTo(c2+mw2,y2);ctx.lineTo(c2-mw2,y2);ctx.fill();}
 }
 drawSigns(horizon,curve);drawAtmosphere(horizon);
 if(Math.abs(curve)>.28){const dir=Math.sign(curve);ctx.save();ctx.translate(W/2+dir*W*.37,horizon+H*.12);ctx.fillStyle='#ffe53b';ctx.shadowColor='#ff2d95';ctx.shadowBlur=10;ctx.font=`900 ${Math.max(20,W*.022)}px monospace`;ctx.fillText(dir>0?'>>>':'<<<',0,0);ctx.restore();}
}
function update(dt){
 state.time+=dt;if(state.mode!=='play')return;
 state.speed+=((input.gas?94:0)-(input.brake?185:0)-18)*dt;state.speed=Math.max(0,Math.min(285,state.speed));
 const steer=input.right-input.left;state.x+=steer*(input.brake?.022:.012)*(state.speed/120+.35);state.x*=Math.pow(.992,dt*60);state.x=Math.max(-1.45,Math.min(1.45,state.x));
 const seg=segAt(state.pos);state.x-=seg.curve*(state.speed/285)*dt*.55;state.pos+=state.speed*dt*5.3;const total=ROAD.segments.length*ROAD.segLen;if(state.pos>=total)state.pos-=total;
 document.getElementById('spd').textContent=Math.round(state.speed);document.getElementById('gear').textContent=Math.max(1,Math.min(6,Math.floor(state.speed/48)+1));
}
function render(){ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);if(state.mode==='title'){if(concept.complete&&concept.naturalWidth)ctx.drawImage(concept,0,0,W,H);else{ctx.fillStyle='#13042b';ctx.fillRect(0,0,W,H)}ctx.fillStyle='rgba(0,0,0,.34)';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.shadowColor='#ff2d95';ctx.shadowBlur=24;ctx.fillStyle='#ff2d95';ctx.font=`900 ${Math.max(44,Math.min(90,W*.075))}px Impact,Arial Black`;ctx.fillText('TTD DEATH CIRCUIT',W/2,H*.22);ctx.shadowBlur=0;ctx.fillStyle='#39d7ff';ctx.font='900 20px monospace';ctx.fillText('PROTOTYPE V3 // TITAN RUN',W/2,H*.28);ctx.fillStyle='#ffe53b';ctx.font='900 17px monospace';ctx.fillText('1 ROAD // 1 CAR // NEON ABUSE RUN',W/2,H*.34);ctx.textAlign='left';return}drawWorld();drawCar()}
function loop(now){const dt=Math.min(.033,(now-state.last)/1000||0);state.last=now;update(dt);render();requestAnimationFrame(loop)}
function hold(id,key){const el=document.getElementById(id),off=()=>{input[key]=0;el.classList.remove('active')};el.addEventListener('pointerdown',e=>{e.preventDefault();input[key]=1;el.classList.add('active');try{el.setPointerCapture(e.pointerId)}catch(_){}});['pointerup','pointercancel','lostpointercapture'].forEach(t=>el.addEventListener(t,off))}
hold('left','left');hold('right','right');hold('throttle','gas');hold('brake','brake');
document.getElementById('start').addEventListener('pointerdown',e=>{e.preventDefault();state.mode='play';state.speed=0;state.pos=0;state.x=0});
['contextmenu','selectstart','dragstart','dblclick','gesturestart'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code))e.preventDefault();if(e.code==='ArrowLeft'||e.code==='KeyA')input.left=1;if(e.code==='ArrowRight'||e.code==='KeyD')input.right=1;if(e.code==='ArrowUp'||e.code==='KeyW')input.gas=1;if(e.code==='ArrowDown'||e.code==='KeyS'||e.code==='Space')input.brake=1;if(e.code==='Enter')state.mode='play'});
addEventListener('keyup',e=>{if(e.code==='ArrowLeft'||e.code==='KeyA')input.left=0;if(e.code==='ArrowRight'||e.code==='KeyD')input.right=0;if(e.code==='ArrowUp'||e.code==='KeyW')input.gas=0;if(e.code==='ArrowDown'||e.code==='KeyS'||e.code==='Space')input.brake=0});

let audioCtx=null,musicOn=false,musicTimer=null,musicStep=0;
function musicStart(){
 if(musicOn)return;
 audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
 if(audioCtx.state==='suspended')audioCtx.resume();
 musicOn=true;document.getElementById('music').textContent='♫ SYNTH ON';
 const bass=[36,36,43,36,48,43,36,34],lead=[60,63,67,70,67,63,58,55];
 const tick=()=>{
   if(!musicOn)return;
   const now=audioCtx.currentTime,hz=n=>440*Math.pow(2,(n-69)/12);
   const mk=(freq,type,dur,gain,det=0)=>{
     const o=audioCtx.createOscillator(),g=audioCtx.createGain();
     o.type=type;o.frequency.value=freq;o.detune.value=det;
     g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(gain,now+.012);g.gain.exponentialRampToValueAtTime(.0001,now+dur);
     o.connect(g);g.connect(audioCtx.destination);o.start(now);o.stop(now+dur+.03);
   };
   mk(hz(bass[musicStep%bass.length]),'sawtooth',.19,.028,-5);
   if(musicStep%2===0)mk(hz(lead[(musicStep/2)%lead.length]),'square',.12,.010,4);
   const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.setValueAtTime(110,now);o.frequency.exponentialRampToValueAtTime(42,now+.11);g.gain.setValueAtTime(.045,now);g.gain.exponentialRampToValueAtTime(.0001,now+.12);o.connect(g);g.connect(audioCtx.destination);o.start(now);o.stop(now+.13);
   musicStep++;musicTimer=setTimeout(tick,150);
 };
 tick();
}
function musicStop(){musicOn=false;if(musicTimer)clearTimeout(musicTimer);musicTimer=null;document.getElementById('music').textContent='♫ SYNTH OFF';}
document.getElementById('music').addEventListener('pointerdown',e=>{e.preventDefault();musicOn?musicStop():musicStart()});

requestAnimationFrame(loop);
})();
</script>
</body>
</html>
