<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>TTD DEATH CIRCUIT // MAX DAMAGE V5.1 HD ASSETS</title>
<style>
:root{--p:#ff2d95;--c:#39d7ff;--g:#8aff2b;--y:#ffe53b}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05030a;color:#fff;font-family:Arial,sans-serif;touch-action:none}
#shell{position:relative;width:100vw;height:100vh;overflow:hidden;background:#05030a}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#badge{position:absolute;z-index:4;left:12px;top:max(10px,env(safe-area-inset-top));padding:8px 11px;border:1px solid rgba(57,215,255,.5);background:rgba(0,0,0,.65);font:900 12px monospace;color:var(--c)}
#hud{position:absolute;z-index:4;right:12px;top:max(10px,env(safe-area-inset-top));display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;max-width:65vw}
.chip{padding:7px 9px;background:rgba(0,0,0,.68);border:1px solid rgba(255,45,149,.45);font:900 11px monospace;border-radius:10px}
.chip b{color:var(--g)}
#controls{position:absolute;z-index:5;left:10px;right:10px;bottom:max(14px,calc(env(safe-area-inset-bottom) + 10px));display:grid;grid-template-columns:150px minmax(220px,1fr) 170px;gap:10px;align-items:end;pointer-events:none}
.ctrl{pointer-events:auto}.steer,.pedals{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{min-height:66px;border-radius:18px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.76);color:#fff;font-weight:900;font-size:18px;box-shadow:inset 0 -5px 0 rgba(0,0,0,.35);touch-action:none;-webkit-tap-highlight-color:transparent}
button:active,.active{transform:translateY(2px);filter:brightness(1.4)}
#left,#right{color:var(--c);border-color:rgba(57,215,255,.55);font-size:28px}
#throttle{color:var(--g);border-color:rgba(138,255,43,.55)}
#brake{color:var(--p);border-color:rgba(255,45,149,.65)}
#start{color:var(--y);border-color:rgba(255,229,59,.6);width:100%}
#nitro{position:absolute;z-index:6;right:156px;bottom:max(96px,calc(env(safe-area-inset-bottom) + 92px));min-height:38px;padding:8px 12px;border-radius:12px;color:var(--g);border-color:rgba(138,255,43,.55);font:900 11px monospace}
#music{position:absolute;z-index:6;right:12px;bottom:max(96px,calc(env(safe-area-inset-bottom) + 92px));min-height:38px;padding:8px 12px;border-radius:12px;color:var(--c);border-color:rgba(57,215,255,.55);font:900 11px monospace}
@media(max-width:760px){#controls{grid-template-columns:120px 1fr 130px;gap:6px}button{min-height:58px;font-size:15px}#left,#right{font-size:24px}.chip{font-size:9px}}
</style>
</head>
<body>
<div id="shell">
<canvas id="game"></canvas>
<div id="badge">TTD DEATH CIRCUIT // MAX DAMAGE V5.1 HD ASSETS</div>
<div id="hud"><div class="chip">SPD <b id="spd">0</b></div><div class="chip">GEAR <b id="gear">1</b></div><div class="chip">ROAD <b id="district">TITAN RUN</b></div><div class="chip">POS <b id="racepos">1/6</b></div><div class="chip">CHECK <b id="check">0/5</b></div><div class="chip">LAP <b id="lap">1/3</b></div><div class="chip">SCORE <b id="score">000000</b></div><div class="chip">NITRO <b id="nitroVal">100</b></div></div>
<div id="controls">
  <div class="ctrl steer"><button id="left">◀</button><button id="right">▶</button></div>
  <div class="ctrl pedals"><button id="brake">BRAKE / DRIFT</button><button id="throttle">THROTTLE</button></div>
  <div class="ctrl"><button id="start">START / RESET</button></div>
</div>
<button id="nitro">⚡ NITRO</button><button id="music">♫ SYNTH OFF</button>
</div>
<script>
(()=>{
'use strict';
const c=document.getElementById('game'),ctx=c.getContext('2d');
let W=0,H=0,dpr=1;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=Math.floor(W*dpr);c.height=Math.floor(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize,{passive:true});resize();
const concept=new Image();concept.src='assets/death-circuit-concept.png';
const bg1=new Image();bg1.src='assets/background-view-1.png';
const carImg=new Image();carImg.src='assets/mayhem-car-rear.png';
const HD={
 playerIdle:new Image(),playerBoost:new Image(),
 rivals:[],traffic:[]
};
HD.playerIdle.src='assets/death-circuit-v5/mayhem-rear-idle.png';
HD.playerBoost.src='assets/death-circuit-v5/mayhem-rear-boost.png';
['enforcer.png','neon-runner.png','credit-viper.png','military-interceptor.png','alien-drifter.png']
 .forEach(n=>{const im=new Image();im.src='assets/death-circuit-v5/'+n;HD.rivals.push(im)});
['credit-viper.png','nutri-haul.png','enforcer.png','neon-runner.png']
 .forEach(n=>{const im=new Image();im.src='assets/death-circuit-v5/'+n;HD.traffic.push(im)});

const input={left:0,right:0,gas:0,brake:0};
const state={
 mode:'title',speed:0,pos:0,x:0,last:performance.now(),time:0,
 score:0,checkpoints:0,lap:1,nitro:100,nitroOn:false,combo:1,
 districtIndex:0,crash:0,flash:0,finish:false
};
const SIGNS=[
 {brand:'SKULL JUICE',copy:"IT'S NOT JUICE. IT'S A WARNING.",c:'#8aff2b'},
 {brand:'TITAN BABE',copy:'STRONG. SEXY. DANGEROUS.',c:'#ff2d95'},
 {brand:'TDI',copy:'BUILDING TOMORROW. WEAPONIZING TODAY.',c:'#c54cff'},
 {brand:'POWER AUTHORITY',copy:'SQUATS. SWEAT. QUESTIONABLE DECISIONS.',c:'#39d7ff'},
 {brand:'MORTIS COMPLIANCE',copy:'YOUR CRASH HAS BEEN APPROVED.',c:'#39d7ff'},
 {brand:'TTD',copy:'DRIVE FASTER, MUTANT.',c:'#8aff2b'},
 {brand:'VHS QUARTER',copy:'LIVE HARD. DIE ON TAPE.',c:'#ff2d95'},
 {brand:'TBN MEDIA',copy:'WE OWN THE SKY.',c:'#39d7ff'},
 {brand:'TTD',copy:'BRAKES ARE A PERSONAL FAILURE.',c:'#ff2d95'},
 {brand:'TTD',copy:'1ST TRY IS LAST TRY.',c:'#ffe53b'}
];


const DISTRICTS=[
 {name:'TITAN RUN'},
 {name:'VHS QUARTER'},
 {name:'FINANCIAL DISTRICT'},
 {name:'NUTRITION DISTRICT'},
 {name:'MILITARY ZONE'},
 {name:'TITAN HEIGHTS'}
];
const rivals=[],traffic=[],checkpoints=[];
const TRACK_LEN=()=>ROAD.segments.length*ROAD.segLen;

function seedRaceObjects(){
 rivals.length=0;traffic.length=0;checkpoints.length=0;
 const total=TRACK_LEN();
 for(let i=0;i<5;i++)checkpoints.push({z:total*(i+1)/6,passed:false});
 for(let i=0;i<5;i++){
   rivals.push({
     z:700+i*1180,lane:(i%3-1)*.46,speed:178+i*14,hp:100,phase:i*.93,alive:true,
     color:['#ff2d95','#39d7ff','#8aff2b','#ffe53b','#c54cff'][i%5]
   });
 }
 for(let i=0;i<20;i++){
   traffic.push({z:330+i*480,lane:((i*37)%100/100)*1.55-.775,speed:88+(i%6)*18,kind:i%3,alive:true});
 }
}

const ROAD={segments:[],segLen:180,roadWidth:2100,cameraHeight:900,cameraDepth:1.15,drawDistance:170};
function addRoad(n,curve=0,hill=0){const start=ROAD.segments.length;for(let i=0;i<n;i++){const t=i/Math.max(1,n-1);ROAD.segments.push({curve:curve*Math.sin(Math.PI*t),hill:hill*Math.sin(Math.PI*t),stripe:(start+i)%2})}}
addRoad(45);addRoad(50,.75,.08);addRoad(35,-.45,-.03);addRoad(60,-.95,.06);addRoad(45,.55,-.05);addRoad(70,0,.02);addRoad(55,.85,.03);addRoad(55,-.65,-.03);
function segAt(z){return ROAD.segments[Math.floor(z/ROAD.segLen)%ROAD.segments.length]}
function project(worldX,worldY,worldZ,cameraX,cameraY,cameraZ){const dz=worldZ-cameraZ,scale=ROAD.cameraDepth/Math.max(1,dz);return{scale,x:W/2+scale*(worldX-cameraX)*W/2,y:H/2-scale*(worldY-cameraY)*H/2}}
function drawCar(){
 const x=W/2+state.x*W*.18,y=H*.815;
 const steer=input.right-input.left;
 const s=Math.max(.78,Math.min(1.10,W/1420));
 ctx.save();ctx.translate(x,y);
 ctx.rotate(steer*.055);

 ctx.globalAlpha=.34;ctx.fillStyle='#000';
 ctx.beginPath();ctx.ellipse(0,42,150,32,0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;

 const source=(state.nitroOn&&state.nitro>0&&HD.playerBoost.complete)?HD.playerBoost:HD.playerIdle;
 if(source&&source.complete&&source.naturalWidth){
   const w=(state.nitroOn?430:408)*s;
   const h=w*(source.naturalHeight/source.naturalWidth);
   ctx.shadowColor=state.nitroOn?'#ff2d95':'#39d7ff';
   ctx.shadowBlur=state.nitroOn?28:16;
   ctx.drawImage(source,-w/2+steer*14,-h*.78,w,h);
   ctx.shadowBlur=0;
 }else if(carImg.complete&&carImg.naturalWidth){
   const w=390*s,h=w*(carImg.naturalHeight/carImg.naturalWidth);
   ctx.drawImage(carImg,-w/2,-h*.78,w,h);
 }

 // extra turbo pulse to make boost feel alive even on static PNG
 if(state.nitroOn&&state.nitro>0){
   const pulse=1+.12*Math.sin(state.time*26);
   ctx.save();ctx.globalAlpha=.45+.20*Math.sin(state.time*30);
   ctx.fillStyle='#ff2d95';ctx.shadowColor='#ff2d95';ctx.shadowBlur=22;
   for(const ex of [-62,62]){
     ctx.beginPath();ctx.moveTo(ex,26);ctx.lineTo(ex-16,26+68*pulse);ctx.lineTo(ex+16,26);ctx.fill();
   }
   ctx.restore();
 }
 ctx.restore();
}

function roadProfile(horizon,bottom,curve){
  const v=state.speed/285;
  return {
    center:p=>W/2 + curve*W*.60*(.22+.78*v)*(p*p*(1.40-.40*p)) - state.x*W*.11*p,
    half:p=>W*(.034 + .51*p)
  };
}

function drawSideGround(horizon,bottom,curve){
  const prof=roadProfile(horizon,bottom,curve);
  const strips=64;
  for(let i=0;i<strips;i++){
    const t1=i/strips,t2=(i+1)/strips;
    const p1=t1*t1,p2=t2*t2;
    const y1=horizon+(bottom-horizon)*p1;
    const y2=horizon+(bottom-horizon)*p2;
    const c1=prof.center(p1),c2=prof.center(p2);
    const h1=prof.half(p1),h2=prof.half(p2);

    // Side ground wider than road
    const outer1=h1*1.52,outer2=h2*1.52;
    ctx.fillStyle=(i%2)?'#0b0810':'#13091a';

    ctx.beginPath();
    ctx.moveTo(c1-outer1,y1);ctx.lineTo(c1-h1,y1);
    ctx.lineTo(c2-h2,y2);ctx.lineTo(c2-outer2,y2);ctx.closePath();ctx.fill();

    ctx.beginPath();
    ctx.moveTo(c1+h1,y1);ctx.lineTo(c1+outer1,y1);
    ctx.lineTo(c2+outer2,y2);ctx.lineTo(c2+h2,y2);ctx.closePath();ctx.fill();

    // neon shoulder strips
    ctx.lineWidth=Math.max(1,1+p2*5);
    ctx.strokeStyle=(i%2)?'#39d7ff':'#ff2d95';
    ctx.beginPath();
    ctx.moveTo(c1-h1*1.08,y1);ctx.lineTo(c2-h2*1.08,y2);
    ctx.moveTo(c1+h1*1.08,y1);ctx.lineTo(c2+h2*1.08,y2);
    ctx.stroke();
  }
}

function drawGuardRails(horizon,bottom,curve){
  const prof=roadProfile(horizon,bottom,curve);
  for(let i=8;i<64;i+=4){
    const p=(i/64)**2;
    const y=horizon+(bottom-horizon)*p;
    const c=prof.center(p),h=prof.half(p);
    const postH=10+56*p;
    const railOff=h*1.18;
    ctx.strokeStyle=i%8===0?'#ff2d95':'#39d7ff';
    ctx.lineWidth=Math.max(1,2+4*p);
    for(const side of [-1,1]){
      const x=c+side*railOff;
      ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y-postH);ctx.stroke();
      ctx.beginPath();ctx.moveTo(x-side*22*p,y-postH*.65);ctx.lineTo(x+side*22*p,y-postH*.65);ctx.stroke();
    }
  }
}

function drawSigns(horizon,bottom,curve){
  const prof=roadProfile(horizon,bottom,curve);
  const spacing=980;
  const base=Math.floor(state.pos/spacing);

  for(let k=0;k<6;k++){
    const idx=base+k;
    let dist=(idx*spacing-state.pos);
    while(dist<0)dist+=spacing*12;
    if(dist>spacing*5.2)continue;

    const depth=1-dist/(spacing*5.2);
    const p=.07+.93*depth*depth;
    const side=(idx%2)?1:-1;
    const y=horizon+(bottom-horizon)*p;
    const c=prof.center(p),h=prof.half(p);
    const x=c+side*h*1.34;
    const sc=.34+.95*p;
    const sign=SIGNS[((idx%SIGNS.length)+SIGNS.length)%SIGNS.length];
    const sw=205*sc,sh=82*sc;

    ctx.save();ctx.translate(x,y-sh*.82);
    ctx.shadowColor=sign.c;ctx.shadowBlur=16*sc;
    ctx.fillStyle='rgba(4,4,10,.92)';
    ctx.strokeStyle=sign.c;
    ctx.lineWidth=Math.max(1,2.5*sc);
    ctx.fillRect(-sw/2,-sh/2,sw,sh);
    ctx.strokeRect(-sw/2,-sh/2,sw,sh);
    ctx.shadowBlur=0;

    ctx.textAlign='center';
    ctx.fillStyle=sign.c;
    ctx.font=`900 ${Math.max(9,18*sc)}px monospace`;
    ctx.fillText(sign.brand,0,-7*sc);
    ctx.fillStyle='#fff';
    ctx.font=`900 ${Math.max(6,9*sc)}px monospace`;
    ctx.fillText(sign.copy,0,15*sc);

    // pole
    ctx.strokeStyle='#777';
    ctx.lineWidth=Math.max(1,3*sc);
    ctx.beginPath();ctx.moveTo(0,sh/2);ctx.lineTo(0,sh*.95);ctx.stroke();

    ctx.restore();
  }
}

function drawAtmosphere(horizon){
  const v=state.speed/285;

  // horizon haze
  const haze=ctx.createLinearGradient(0,horizon-H*.08,0,horizon+H*.24);
  haze.addColorStop(0,'rgba(255,45,149,0)');
  haze.addColorStop(.42,`rgba(255,45,149,${.06+.10*v})`);
  haze.addColorStop(.72,`rgba(57,215,255,${.03+.06*v})`);
  haze.addColorStop(1,'rgba(57,215,255,0)');
  ctx.fillStyle=haze;ctx.fillRect(0,horizon-H*.08,W,H*.32);

  // speed streaks
  if(state.speed>110){
    const count=Math.floor(14+32*v);
    ctx.save();
    ctx.globalAlpha=.10+.18*v;
    ctx.lineWidth=1+2.5*v;
    for(let i=0;i<count;i++){
      const seed=(i*79+Math.floor(state.time*22)*17)%997;
      const side=(i%2)?1:-1;
      const y=horizon+((seed%100)/100)*(H-horizon);
      const x=W/2+side*(W*.31+(seed%43)/43*W*.30);
      ctx.strokeStyle=(i%3)?'#39d7ff':'#ff2d95';
      ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+side*(24+90*v),y+8+28*v);ctx.stroke();
    }
    ctx.restore();
  }
}


function wrapDist(z){
 const total=TRACK_LEN();let d=z-state.pos;
 while(d<0)d+=total;while(d>=total)d-=total;return d;
}
function drawRivalCar(x,y,scale,color,lean=0,img=null){
 ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);ctx.rotate(lean);
 ctx.globalAlpha=.24;ctx.fillStyle='#000';ctx.beginPath();ctx.ellipse(0,20,48,12,0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
 if(img&&img.complete&&img.naturalWidth){
   const w=126,h=w*(img.naturalHeight/img.naturalWidth);
   ctx.shadowColor=color;ctx.shadowBlur=7;
   ctx.drawImage(img,-w/2,-h*.76,w,h);
   ctx.shadowBlur=0;
 }else{
   ctx.fillStyle='#11131a';ctx.strokeStyle=color;ctx.lineWidth=2.5;
   ctx.beginPath();ctx.moveTo(-48,14);ctx.lineTo(-37,-16);ctx.lineTo(-20,-28);ctx.lineTo(20,-28);ctx.lineTo(37,-16);ctx.lineTo(48,14);ctx.lineTo(33,27);ctx.lineTo(-33,27);ctx.closePath();ctx.fill();ctx.stroke();
 }
 ctx.restore();
}
function drawTrafficAndRivals(horizon,bottom,curve){
 const prof=roadProfile(horizon,bottom,curve),maxD=5600,list=[];
 for(const t of traffic){if(t.alive){const d=wrapDist(t.z);if(d<maxD)list.push({o:t,d,type:'traffic'})}}
 for(const r of rivals){if(r.alive){const d=wrapDist(r.z);if(d<maxD)list.push({o:r,d,type:'rival'})}}
 list.sort((a,b)=>b.d-a.d);
 for(const it of list){
   const depth=1-it.d/maxD,p=.05+.95*depth*depth;
   const y=horizon+(bottom-horizon)*p,c=prof.center(p),h=prof.half(p);
   const x=c+it.o.lane*h*.72,sc=.22+1.12*p;
   drawRivalCar(x,y,sc,it.type==='rival'?it.o.color:'#777',it.type==='rival'?Math.sin(it.o.phase+state.time)*.025:0,it.type==='rival'?HD.rivals[(it.o.phase*10|0)%HD.rivals.length]:HD.traffic[(it.o.kind||0)%HD.traffic.length]);
 }
}
function updateRaceObjects(dt){
 const total=TRACK_LEN();
 for(const t of traffic){if(t.alive)t.z=(t.z+t.speed*dt*4.3)%total}
 for(const r of rivals){
   if(!r.alive)continue;
   r.z=(r.z+r.speed*dt*4.3)%total;
   r.lane+=Math.sin(state.time*.9+r.phase)*dt*.035;
   r.lane=Math.max(-.82,Math.min(.82,r.lane));
 }

 for(const cp of checkpoints){
   if(cp.passed)continue;
   const d=wrapDist(cp.z);
   if(d<150&&state.speed>40){
     cp.passed=true;state.checkpoints++;state.score+=2500*state.combo;state.combo=Math.min(8,state.combo+1);state.flash=.35;
     if(state.checkpoints>=5){
       state.lap++;
       if(state.lap>3){state.finish=true;state.mode='finish'}
       else{state.checkpoints=0;checkpoints.forEach(c=>c.passed=false)}
     }
   }
 }

 const playerLane=state.x/1.45*.82;
 for(const t of traffic){
   if(!t.alive)continue;
   const d=wrapDist(t.z),lat=Math.abs(t.lane-playerLane);
   if(d<95&&lat<.22){
     if(state.nitroOn&&state.speed>220){t.alive=false;state.score+=900*state.combo;state.combo=Math.min(8,state.combo+1);state.flash=.25}
     else{state.speed*=.58;state.crash=.55;state.combo=1;state.flash=.28;t.z=(t.z+420)%total}
   }
 }
 for(const r of rivals){
   if(!r.alive)continue;
   const d=wrapDist(r.z),lat=Math.abs(r.lane-playerLane);
   if(d<110&&lat<.23){
     if(state.nitroOn&&state.speed>230){
       r.hp-=120*dt;
       if(r.hp<=0){r.alive=false;state.score+=5000*state.combo;state.combo=Math.min(8,state.combo+1);state.flash=.35}
     }else{state.speed*=.72;state.crash=.35;state.combo=1}
   }
 }

 let ahead=0;
 for(const r of rivals){if(r.alive&&wrapDist(r.z)<TRACK_LEN()/2)ahead++}
 document.getElementById('racepos').textContent=`${Math.min(6,ahead+1)}/6`;
}
function updateDistrict(){
 const p=(state.pos%TRACK_LEN())/TRACK_LEN();
 state.districtIndex=Math.min(DISTRICTS.length-1,Math.floor(p*DISTRICTS.length));
 document.getElementById('district').textContent=DISTRICTS[state.districtIndex].name;
}
function drawCheckpointBanner(horizon,bottom,curve){
 const next=checkpoints.find(c=>!c.passed);if(!next)return;
 const d=wrapDist(next.z);if(d>5200)return;
 const depth=1-d/5200,p=.05+.95*depth*depth;if(p<.12)return;
 const prof=roadProfile(horizon,bottom,curve),y=horizon+(bottom-horizon)*p,c=prof.center(p),h=prof.half(p),sw=h*1.45;
 ctx.save();ctx.strokeStyle='#ffe53b';ctx.lineWidth=Math.max(2,5*p);ctx.shadowColor='#ff2d95';ctx.shadowBlur=12;
 ctx.beginPath();ctx.moveTo(c-sw/2,y);ctx.lineTo(c+sw/2,y);ctx.stroke();
 ctx.shadowBlur=0;ctx.textAlign='center';ctx.fillStyle='#ffe53b';ctx.font=`900 ${Math.max(8,22*p)}px monospace`;ctx.fillText('CHECKPOINT',c,y-8*p);ctx.restore();
}
function drawRaceHUD(){
 document.getElementById('check').textContent=`${state.checkpoints}/5`;
 document.getElementById('lap').textContent=`${Math.min(state.lap,3)}/3`;
 document.getElementById('score').textContent=String(Math.round(state.score)).padStart(6,'0');
 document.getElementById('nitroVal').textContent=Math.round(state.nitro);
 if(state.finish){
   ctx.fillStyle='rgba(0,0,0,.68)';ctx.fillRect(0,0,W,H);
   ctx.textAlign='center';ctx.shadowColor='#ff2d95';ctx.shadowBlur=22;ctx.fillStyle='#8aff2b';
   ctx.font=`900 ${Math.max(44,W*.055)}px Impact,Arial Black`;ctx.fillText('MAX DAMAGE COMPLETE',W/2,H*.42);
   ctx.shadowBlur=0;ctx.fillStyle='#ff2d95';ctx.font='900 22px monospace';ctx.fillText(`SCORE ${String(Math.round(state.score)).padStart(6,'0')}`,W/2,H*.49);
   ctx.fillStyle='#ffe53b';ctx.font='900 16px monospace';ctx.fillText('TTD APPROVED // INSURANCE DENIED',W/2,H*.55);ctx.textAlign='left';
 }
}

function drawWorld(){
 const horizon=H*.48,bottom=H*1.04;

 // Background View 1
 if(bg1.complete&&bg1.naturalWidth){
   const bw=W*1.12,bh=H*.56,bx=(W-bw)/2-state.x*W*.024;
   ctx.drawImage(bg1,bx,0,bw,bh);
 }else{
   const sky=ctx.createLinearGradient(0,0,0,H*.56);
   sky.addColorStop(0,'#13042b');sky.addColorStop(.4,'#7f145d');sky.addColorStop(1,'#ff7a55');
   ctx.fillStyle=sky;ctx.fillRect(0,0,W,H*.56);
 }

 const seg=segAt(state.pos);
 const next=segAt(state.pos+ROAD.segLen*10);
 const curve=seg.curve*.72+next.curve*.28;
 const prof=roadProfile(horizon,bottom,curve);

 // world ground behind road
 const g=ctx.createLinearGradient(0,horizon,0,H);
 g.addColorStop(0,'#14091a');g.addColorStop(1,'#05040a');
 ctx.fillStyle=g;ctx.fillRect(0,horizon,W,H-horizon);

 drawSideGround(horizon,bottom,curve);

 // Wider road
 const strips=76;
 for(let i=0;i<strips;i++){
   const t1=i/strips,t2=(i+1)/strips;
   const p1=t1*t1,p2=t2*t2;
   const y1=horizon+(bottom-horizon)*p1;
   const y2=horizon+(bottom-horizon)*p2;
   const c1=prof.center(p1),c2=prof.center(p2);
   const h1=prof.half(p1),h2=prof.half(p2);

   ctx.fillStyle=(i%2)?'#17121d':'#211827';
   ctx.beginPath();
   ctx.moveTo(c1-h1,y1);ctx.lineTo(c1+h1,y1);
   ctx.lineTo(c2+h2,y2);ctx.lineTo(c2-h2,y2);
   ctx.closePath();ctx.fill();

   // subtle lane reflection
   ctx.fillStyle=`rgba(255,45,149,${.015+.025*p2})`;
   ctx.beginPath();
   ctx.moveTo(c1-h1*.82,y1);ctx.lineTo(c1+h1*.82,y1);
   ctx.lineTo(c2+h2*.82,y2);ctx.lineTo(c2-h2*.82,y2);
   ctx.closePath();ctx.fill();

   // neon edge
   ctx.lineWidth=Math.max(1,1+p2*5);
   ctx.strokeStyle=(i%2)?'#ff2d95':'#39d7ff';
   ctx.beginPath();
   ctx.moveTo(c1-h1,y1);ctx.lineTo(c2-h2,y2);
   ctx.moveTo(c1+h1,y1);ctx.lineTo(c2+h2,y2);ctx.stroke();

   // center broken line
   if(((i+Math.floor(state.pos/70))%6)<3){
     const mw1=Math.max(1,h1*.018),mw2=Math.max(1,h2*.018);
     ctx.fillStyle='#ffe53b';
     ctx.beginPath();
     ctx.moveTo(c1-mw1,y1);ctx.lineTo(c1+mw1,y1);
     ctx.lineTo(c2+mw2,y2);ctx.lineTo(c2-mw2,y2);ctx.closePath();ctx.fill();
   }

   // lane separators for wider arcade highway
   if(i%2===0){
     ctx.strokeStyle='rgba(255,255,255,.16)';
     ctx.lineWidth=Math.max(1,p2*2);
     for(const lane of [-.42,.42]){
       ctx.beginPath();
       ctx.moveTo(c1+h1*lane,y1);ctx.lineTo(c2+h2*lane,y2);ctx.stroke();
     }
   }
 }

 drawGuardRails(horizon,bottom,curve);
 drawCheckpointBanner(horizon,bottom,curve);
 drawTrafficAndRivals(horizon,bottom,curve);
 drawSigns(horizon,bottom,curve);
 drawAtmosphere(horizon);

 // curve chevrons
 if(Math.abs(curve)>.24){
   const dir=Math.sign(curve);
   ctx.save();
   ctx.translate(W/2+dir*W*.38,horizon+H*.13);
   ctx.fillStyle='#ffe53b';
   ctx.shadowColor='#ff2d95';ctx.shadowBlur=12;
   ctx.font=`900 ${Math.max(22,W*.022)}px monospace`;
   ctx.fillText(dir>0?'>>>':'<<<',0,0);
   ctx.restore();
 }
}
function update(dt){
 state.time+=dt;state.crash=Math.max(0,state.crash-dt);state.flash=Math.max(0,state.flash-dt);
 if(state.mode!=='play')return;

 const nitroBoost=state.nitroOn&&state.nitro>0;
 const accel=input.gas?(nitroBoost?148:94):0;
 const brake=input.brake?185:0;
 state.speed+=(accel-brake-18)*dt;
 state.speed=Math.max(0,Math.min(285,state.speed));

 if(nitroBoost){state.nitro=Math.max(0,state.nitro-28*dt);state.score+=18*dt;if(state.nitro<=0)state.nitroOn=false}
 else state.nitro=Math.min(100,state.nitro+5.5*dt);

 const steer=input.right-input.left;
 state.x+=steer*(input.brake?.022:.012)*(state.speed/120+.35);
 state.x*=Math.pow(.992,dt*60);
 state.x=Math.max(-1.45,Math.min(1.45,state.x));

 const seg=segAt(state.pos);
 state.x-=seg.curve*(state.speed/285)*dt*.55;
 state.pos+=state.speed*dt*5.3;
 if(state.pos>=TRACK_LEN())state.pos-=TRACK_LEN();

 updateRaceObjects(dt);updateDistrict();
 state.score+=state.speed*dt*.14*state.combo;

 document.getElementById('spd').textContent=Math.round(state.speed);
 document.getElementById('gear').textContent=Math.max(1,Math.min(6,Math.floor(state.speed/48)+1));
}
function render(){ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);if(state.mode==='title'){if(concept.complete&&concept.naturalWidth)ctx.drawImage(concept,0,0,W,H);else{ctx.fillStyle='#13042b';ctx.fillRect(0,0,W,H)}ctx.fillStyle='rgba(0,0,0,.34)';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.shadowColor='#ff2d95';ctx.shadowBlur=24;ctx.fillStyle='#ff2d95';ctx.font=`900 ${Math.max(44,Math.min(90,W*.075))}px Impact,Arial Black`;ctx.fillText('TTD DEATH CIRCUIT',W/2,H*.22);ctx.shadowBlur=0;ctx.fillStyle='#39d7ff';ctx.font='900 20px monospace';ctx.fillText('MAX DAMAGE V5.1 HD ASSETS // TITAN RUN',W/2,H*.28);ctx.fillStyle='#ffe53b';ctx.font='900 17px monospace';ctx.fillText('1 ROAD // 1 CAR // FULL MAYHEM ROAD',W/2,H*.34);ctx.textAlign='left';return}drawWorld();drawCar();drawRaceHUD();if(state.crash>0){ctx.fillStyle=`rgba(255,45,149,${state.crash*.22})`;ctx.fillRect(0,0,W,H)}if(state.flash>0){ctx.fillStyle=`rgba(255,229,59,${state.flash*.20})`;ctx.fillRect(0,0,W,H)}}
function loop(now){const dt=Math.min(.033,(now-state.last)/1000||0);state.last=now;update(dt);render();requestAnimationFrame(loop)}
function hold(id,key){const el=document.getElementById(id),off=()=>{input[key]=0;el.classList.remove('active')};el.addEventListener('pointerdown',e=>{e.preventDefault();input[key]=1;el.classList.add('active');try{el.setPointerCapture(e.pointerId)}catch(_){}});['pointerup','pointercancel','lostpointercapture'].forEach(t=>el.addEventListener(t,off))}
hold('left','left');hold('right','right');hold('throttle','gas');hold('brake','brake');
document.getElementById('start').addEventListener('pointerdown',e=>{e.preventDefault();state.mode='play';state.speed=0;state.pos=0;state.x=0;state.score=0;state.checkpoints=0;state.lap=1;state.nitro=100;state.combo=1;state.finish=false;seedRaceObjects();});

const nitroBtn=document.getElementById('nitro');
const nitroOff=()=>{state.nitroOn=false;nitroBtn.classList.remove('active')};
nitroBtn.addEventListener('pointerdown',e=>{e.preventDefault();if(state.mode==='play'&&state.nitro>0){state.nitroOn=true;nitroBtn.classList.add('active');try{nitroBtn.setPointerCapture(e.pointerId)}catch(_){}}});
['pointerup','pointercancel','lostpointercapture'].forEach(t=>nitroBtn.addEventListener(t,nitroOff));

['contextmenu','selectstart','dragstart','dblclick','gesturestart'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code))e.preventDefault();if(e.code==='ArrowLeft'||e.code==='KeyA')input.left=1;if(e.code==='ArrowRight'||e.code==='KeyD')input.right=1;if(e.code==='ArrowUp'||e.code==='KeyW')input.gas=1;if(e.code==='ArrowDown'||e.code==='KeyS'||e.code==='Space')input.brake=1;if(e.code==='ShiftLeft'||e.code==='KeyN')state.nitroOn=true;if(e.code==='Enter'){state.mode='play';seedRaceObjects()}});
addEventListener('keyup',e=>{if(e.code==='ArrowLeft'||e.code==='KeyA')input.left=0;if(e.code==='ArrowRight'||e.code==='KeyD')input.right=0;if(e.code==='ArrowUp'||e.code==='KeyW')input.gas=0;if(e.code==='ArrowDown'||e.code==='KeyS'||e.code==='Space')input.brake=0;if(e.code==='ShiftLeft'||e.code==='KeyN')state.nitroOn=false});

let audioCtx=null,musicOn=false,musicTimer=null,musicStep=0;
function musicStart(){
 if(musicOn)return;
 audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
 if(audioCtx.state==='suspended')audioCtx.resume();
 musicOn=true;document.getElementById('music').textContent='♫ SYNTH ON';
 const bass=[36,36,43,36,48,43,36,34],lead=[60,63,67,70,67,63,58,55];
 const tick=()=>{
   if(!musicOn)return;
   const now=audioCtx.currentTime,hz=n=>440*Math.pow(2,(n-69)/12);
   const mk=(freq,type,dur,gain,det=0)=>{
     const o=audioCtx.createOscillator(),g=audioCtx.createGain();
     o.type=type;o.frequency.value=freq;o.detune.value=det;
     g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(gain,now+.012);g.gain.exponentialRampToValueAtTime(.0001,now+dur);
     o.connect(g);g.connect(audioCtx.destination);o.start(now);o.stop(now+dur+.03);
   };
   mk(hz(bass[musicStep%bass.length]),'sawtooth',.19,.028,-5);
   if(musicStep%2===0)mk(hz(lead[(musicStep/2)%lead.length]),'square',.12,.010,4);
   musicStep++;musicTimer=setTimeout(tick,150);
 };
 tick();
}
function musicStop(){musicOn=false;if(musicTimer)clearTimeout(musicTimer);musicTimer=null;document.getElementById('music').textContent='♫ SYNTH OFF';}
document.getElementById('music').addEventListener('pointerdown',e=>{e.preventDefault();musicOn?musicStop():musicStart()});

seedRaceObjects();requestAnimationFrame(loop);
})();
</script>
