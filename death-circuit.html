<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>TTD DEATH CIRCUIT</title>
<style>
:root{--p:#ff2d95;--c:#39d7ff;--g:#8aff2b;--y:#ffe53b;--bg:#050308}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050308;color:#fff;font-family:Arial,sans-serif;touch-action:none}
#shell{position:relative;width:100vw;height:100vh;overflow:hidden;background:#050308}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#topbar{position:absolute;z-index:6;left:10px;right:10px;top:max(8px,env(safe-area-inset-top));display:flex;justify-content:space-between;gap:8px;pointer-events:none}
#brand{padding:7px 10px;border:1px solid rgba(57,215,255,.45);border-radius:10px;background:rgba(0,0,0,.72);font:900 11px monospace;color:var(--c);backdrop-filter:blur(5px)}
#hud{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;max-width:78vw}
.chip{padding:6px 8px;background:rgba(0,0,0,.72);border:1px solid rgba(255,45,149,.34);font:900 10px monospace;border-radius:9px;backdrop-filter:blur(5px)}
.chip b{color:var(--g)}
#controls{position:absolute;z-index:8;left:10px;right:10px;bottom:max(40px,calc(env(safe-area-inset-bottom) + 36px));display:grid;grid-template-columns:180px minmax(250px,1fr) 180px;gap:10px;align-items:end;pointer-events:none}
.ctrl{pointer-events:auto}.steer,.pedals{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{min-height:54px;border-radius:15px;border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.78);color:#fff;font-weight:900;font-size:15px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.35);touch-action:none;-webkit-tap-highlight-color:transparent}
button:active,.active{transform:translateY(2px);filter:brightness(1.3)}
#left,#right{color:var(--c);border-color:rgba(57,215,255,.48);font-size:23px}
#throttle{color:var(--g);border-color:rgba(138,255,43,.48)}
#brake{color:var(--p);border-color:rgba(255,45,149,.52)}
#start{color:var(--y);border-color:rgba(255,229,59,.50)}
#nitro,#music{position:absolute;z-index:9;bottom:max(112px,calc(env(safe-area-inset-bottom) + 108px));min-height:34px;padding:6px 10px;border-radius:10px;font:900 10px monospace}
#nitro{right:150px;color:var(--g);border-color:rgba(138,255,43,.48)}
#music{right:12px;color:var(--c);border-color:rgba(57,215,255,.48)}
#toast{position:absolute;z-index:7;left:50%;top:18%;transform:translateX(-50%);padding:8px 14px;border-radius:999px;background:rgba(0,0,0,.72);border:1px solid rgba(255,255,255,.14);font:900 12px monospace;opacity:0;transition:.18s}
@media(max-width:760px){
 #controls{grid-template-columns:112px 1fr 118px;gap:6px;bottom:max(50px,calc(env(safe-area-inset-bottom) + 46px))}
 button{min-height:48px;font-size:12px}#left,#right{font-size:20px}.chip{font-size:8px;padding:5px 6px}
 #brand{font-size:9px;padding:6px 7px}
 #nitro{right:135px;bottom:max(112px,calc(env(safe-area-inset-bottom) + 108px))}
 #music{bottom:max(112px,calc(env(safe-area-inset-bottom) + 108px))}
}
@media(max-height:760px) and (orientation:landscape){
 #controls{bottom:max(64px,calc(env(safe-area-inset-bottom) + 60px))}
 button{min-height:42px;font-size:11px}
 #nitro,#music{bottom:max(118px,calc(env(safe-area-inset-bottom) + 114px))}
}
</style>
</head>
<body>
<div id="shell">
<canvas id="game"></canvas>
<div id="topbar">
 <div id="brand">TTD DEATH CIRCUIT // GRAPHICS BUILD 2</div>
 <div id="hud">
  <div class="chip">SPD <b id="spd">0</b></div>
  <div class="chip">GEAR <b id="gear">1</b></div>
  <div class="chip">ROAD <b id="district">VHS QUARTER</b></div>
  <div class="chip">POS <b id="racepos">1/4</b></div>
  <div class="chip">CHECK <b id="check">0/5</b></div>
  <div class="chip">LAP <b id="lap">1/3</b></div>
  <div class="chip">SCORE <b id="score">000000</b></div>
  <div class="chip">NITRO <b id="nitroVal">100</b></div>
 </div>
</div>
<div id="toast"></div>
<div id="controls">
 <div class="ctrl steer"><button id="left">◀</button><button id="right">▶</button></div>
 <div class="ctrl pedals"><button id="brake">BRAKE / DRIFT</button><button id="throttle">THROTTLE</button></div>
 <div class="ctrl"><button id="start">START / RESET</button></div>
</div>
<button id="nitro">⚡ NITRO</button>
<button id="music">♫ SYNTH OFF</button>
</div>

<script>
(()=>{
'use strict';
const c=document.getElementById('game'),ctx=c.getContext('2d');
let W=0,H=0,dpr=1;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=Math.floor(W*dpr);c.height=Math.floor(H*dpr);c.style.width=W+'px';c.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize,{passive:true}); resize();

const img=src=>{const i=new Image();i.src=src;return i};
const concept=img('assets/death-circuit-concept.png');
const dcGrass=img('assets/death-circuit-v7/grass.png');
const dcSkyline=img('assets/death-circuit-v7/skyline.png');
const dcBillboards=[
 img('assets/death-circuit-v7/billboard-skull-juice.png'),
 img('assets/death-circuit-v7/billboard-death-circuit.png'),
 img('assets/death-circuit-v7/billboard-titan-babe.png'),
 img('assets/death-circuit-v7/billboard-mortis.png'),
 img('assets/death-circuit-v7/billboard-tdi.png')
];
const dcChevron=img('assets/death-circuit-v7/road-chevron.png');
const dcBarricade=img('assets/death-circuit-v7/road-barricade.png');
const playerIdle=img('assets/death-circuit-v5/mayhem-rear-idle.PNG');
const playerBoost=img('assets/death-circuit-v5/mayhem-rear-boost.png');
const rivalImgs=[
 img('assets/death-circuit-v5/enforcer.png'),
 img('assets/death-circuit-v5/neon-runner.png'),
 img('assets/death-circuit-v5/military-interceptor.png')
];
const trafficImgs=[
 img('assets/death-circuit-v5/credit-viper.png'),
 img('assets/death-circuit-v5/nutri-haul.png'),
 img('assets/death-circuit-v5/alien-drifter.png')
];

const input={left:0,right:0,gas:0,brake:0,nitro:0};
const state={mode:'title',speed:0,pos:0,x:0,last:performance.now(),time:0,score:0,checkpoints:0,lap:1,nitro:100,combo:1,crash:0,flash:0,finish:false,districtIndex:0,shake:0,lastCheckpoint:0};
const DISTRICTS=[
 {name:'VHS QUARTER',sky1:'#2d0a45',sky2:'#f24973',sun:'#ffe060',grass1:'#173d2a',grass2:'#1e5b36',edge:'#39d7ff',city:'#140c22',prop:'palm'},
 {name:'FINANCIAL DISTRICT',sky1:'#101b3e',sky2:'#ff2d95',sun:'#ffe53b',grass1:'#0d2630',grass2:'#123440',edge:'#ffe53b',city:'#0b111f',prop:'tower'},
 {name:'NUTRITION DISTRICT',sky1:'#0d3223',sky2:'#f07b3b',sun:'#fff176',grass1:'#25551f',grass2:'#347326',edge:'#8aff2b',city:'#152015',prop:'tank'},
 {name:'MILITARY ZONE',sky1:'#071827',sky2:'#b5364f',sun:'#ffb34d',grass1:'#29322b',grass2:'#3a4537',edge:'#39d7ff',city:'#101417',prop:'tower'},
 {name:'TITAN HEIGHTS',sky1:'#2b0a39',sky2:'#ff73ad',sun:'#ffe990',grass1:'#11263d',grass2:'#173550',edge:'#ff2d95',city:'#120a1b',prop:'palm'},
 {name:'TITAN RUN',sky1:'#16032b',sky2:'#e95a42',sun:'#ffe53b',grass1:'#1d3e25',grass2:'#295431',edge:'#39d7ff',city:'#110917',prop:'palm'}
];
const SIGNS=[
 {brand:'SKULL JUICE',copy:"IT'S NOT JUICE",c:'#8aff2b'},
 {brand:'TTD',copy:'BRAKES ARE WEAKNESS',c:'#ff2d95'},
 {brand:'TITAN BABE',copy:'STRONG. SEXY. DANGEROUS.',c:'#ffe53b'},
 {brand:'MORTIS',copy:'YOUR CRASH APPROVED',c:'#39d7ff'},
 {brand:'TDI',copy:'SELL THE CITY. BUY THE DIP.',c:'#ff8bd2'}
];

const ROAD={segLen:200,segments:[],drawDistance:105};
function addRoad(n,curve=0,hill=0){
 const s=ROAD.segments.length;
 for(let i=0;i<n;i++){
  const t=i/Math.max(1,n-1);
  ROAD.segments.push({curve:curve*Math.sin(Math.PI*t),hill:hill*Math.sin(Math.PI*t),stripe:(s+i)%2});
 }
}
addRoad(44,0,.02);addRoad(55,.72,.05);addRoad(35,-.45,-.04);addRoad(65,-.82,.04);addRoad(42,.35,0);addRoad(65,.62,.05);addRoad(54,-.6,.03);addRoad(48,0,-.03);
const TRACK_LEN=()=>ROAD.segments.length*ROAD.segLen;
const segAt=z=>ROAD.segments[Math.floor(z/ROAD.segLen)%ROAD.segments.length];

const rivals=[],traffic=[],checks=[];
function seed(){
 rivals.length=0;traffic.length=0;checks.length=0;
 const total=TRACK_LEN();
 for(let i=0;i<5;i++)checks.push({z:total*(i+1)/6,passed:false});
 for(let i=0;i<3;i++)rivals.push({z:1700+i*2250,lane:[-.38,.33,.02][i],speed:178+i*17,kind:i});
 for(let i=0;i<8;i++)traffic.push({z:900+i*1320,lane:[-.56,.51,-.20,.23,-.44,.43,.05,-.08][i],speed:100+(i%3)*18,kind:i%3});
}
seed();

function wrapDist(z){
 const total=TRACK_LEN();let d=z-state.pos;
 while(d<0)d+=total;while(d>=total)d-=total;return d;
}
function district(){return DISTRICTS[state.districtIndex%DISTRICTS.length]}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function lerp(a,b,t){return a+(b-a)*t}
function drawImg(i,x,y,w,h,a=1){
 if(!i||!i.complete||!i.naturalWidth)return false;
 ctx.save();ctx.globalAlpha=a;ctx.drawImage(i,x,y,w,h);ctx.restore();return true;
}
function glowText(txt,x,y,size,color,align='center'){
 ctx.save();ctx.textAlign=align;ctx.font=`900 ${size}px "Arial Black",Arial`;ctx.fillStyle=color;ctx.shadowColor=color;ctx.shadowBlur=size*.25;ctx.fillText(txt,x,y);ctx.restore();
}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.style.opacity='1';clearTimeout(toast.t);toast.t=setTimeout(()=>el.style.opacity='0',1100)}

function sky(horizon){
 const d=district();
 if(dcSkyline.complete&&dcSkyline.naturalWidth){
  const iw=dcSkyline.naturalWidth,ih=dcSkyline.naturalHeight;
  const scale=Math.max(W/iw,(horizon*1.34)/ih);
  const dw=iw*scale,dh=ih*scale;
  const sx=((state.pos*.018)%(Math.max(1,dw-W)));
  ctx.save();
  ctx.globalAlpha=.92;
  ctx.drawImage(dcSkyline,-sx,-dh+horizon*1.08,dw,dh);
  ctx.restore();
 }
 let g=ctx.createLinearGradient(0,0,0,horizon);g.addColorStop(0,d.sky1);g.addColorStop(.55,d.sky2);g.addColorStop(1,'#ff9b61');ctx.fillStyle=g;ctx.fillRect(0,0,W,horizon+2);
 const sx=W*.5+Math.sin(state.time*.03)*W*.03, sy=horizon*.38, sr=Math.min(W,H)*.11;
 ctx.save();ctx.fillStyle=d.sun;ctx.shadowColor=d.sun;ctx.shadowBlur=30;ctx.beginPath();ctx.arc(sx,sy,sr,0,Math.PI*2);ctx.fill();ctx.restore();
 ctx.save();ctx.strokeStyle='rgba(120,40,85,.36)';ctx.lineWidth=5;
 for(let i=-4;i<=4;i++){const yy=sy+i*sr*.18;ctx.beginPath();ctx.moveTo(sx-sr*.95,yy);ctx.lineTo(sx+sr*.95,yy);ctx.stroke()}ctx.restore();

 // mountains
 ctx.fillStyle='rgba(10,7,18,.55)';ctx.beginPath();ctx.moveTo(0,horizon*.78);
 for(let x=0;x<=W+80;x+=80){let y=horizon*(.58+.16*Math.sin((x+state.pos*.018)*.012));ctx.lineTo(x,y)}
 ctx.lineTo(W,horizon);ctx.lineTo(0,horizon);ctx.closePath();ctx.fill();

 // skyline
 const base=horizon*.86, shift=(state.pos*.055)%(W+120);
 for(let i=0;i<28;i++){
  const bw=18+(i%5)*15,bh=28+(i*29%118),x=(i*61+shift)%(W+160)-80,y=base-bh;
  ctx.fillStyle=d.city;ctx.fillRect(x,y,bw,bh);
  ctx.fillStyle=(i%2)?'rgba(255,45,149,.35)':'rgba(57,215,255,.32)';
  ctx.fillRect(x+3,y+5,Math.max(2,bw-6),2);
  ctx.fillStyle='rgba(255,229,59,.18)';
  for(let wy=y+13;wy<base-7;wy+=10)for(let wx=x+5;wx<x+bw-4;wx+=9)if(((wx+wy+i)|0)%3===0)ctx.fillRect(wx,wy,2,3);
 }
}

function roadCurve(){
 let idx=Math.floor(state.pos/ROAD.segLen)%ROAD.segments.length,curve=0;
 for(let i=0;i<14;i++)curve+=ROAD.segments[(idx+i)%ROAD.segments.length].curve*(1-i/15);
 return curve/8;
}

function proj(p,curve){
 const center=W*.5 + curve*W*.50*(p*p*(1.28-.28*p)) - state.x*W*.125*p;
 const half=W*(.026+.47*p);
 return {center,half};
}

function palm(x,y,s,flip=1){
 ctx.save();ctx.translate(x,y);ctx.scale(s*flip,s);
 ctx.strokeStyle='#1a0d1a';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(8,-42,1,-88);ctx.stroke();
 ctx.strokeStyle='rgba(255,45,149,.28)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(4,-5);ctx.quadraticCurveTo(12,-45,4,-84);ctx.stroke();
 ctx.fillStyle='#08170f';
 for(let i=0;i<7;i++){ctx.save();ctx.translate(0,-88);ctx.rotate((i/7)*Math.PI*2);ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(20,-8,38,1);ctx.quadraticCurveTo(20,6,0,0);ctx.fill();ctx.restore()}
 ctx.restore();
}
function tower(x,y,s){
 ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle='#10151d';ctx.fillRect(-14,-70,28,70);ctx.fillStyle='#39d7ff';ctx.globalAlpha=.35;for(let yy=-62;yy<-5;yy+=10)ctx.fillRect(-10,yy,20,2);ctx.globalAlpha=1;ctx.fillStyle='#ff2d95';ctx.fillRect(-3,-90,6,20);ctx.restore();
}
function tank(x,y,s){
 ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle='#1f2a1f';ctx.fillRect(-22,-35,44,35);ctx.beginPath();ctx.ellipse(0,-35,22,8,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#8aff2b';ctx.globalAlpha=.3;ctx.fillRect(-17,-27,34,4);ctx.restore();
}
function billboard(x,y,s,index){
 const im=dcBillboards[index%dcBillboards.length];
 if(!im||!im.complete||!im.naturalWidth)return;
 const ratio=im.naturalWidth/im.naturalHeight;
 const h=128*s,w=h*ratio;
 ctx.save();
 ctx.translate(x,y);
 ctx.shadowColor=index===3?'#39d7ff':'#ff2d95';
 ctx.shadowBlur=18*s;
 ctx.drawImage(im,-w/2,-h,w,h);
 ctx.restore();
}

function roadsideImage(im,x,y,s,baseW=150){
 if(!im||!im.complete||!im.naturalWidth)return;
 const ratio=im.naturalWidth/im.naturalHeight;
 const w=baseW*s,h=w/ratio;
 ctx.save();
 ctx.translate(x,y);
 ctx.shadowColor='#ff2d95';
 ctx.shadowBlur=12*s;
 ctx.drawImage(im,-w/2,-h,w,h);
 ctx.restore();
}

function roadAndScenery(horizon,bottom,curve){
 const d=district();
 // Roadside base only. Real grass texture is clipped into the left/right wedges per slice below.
 ctx.fillStyle=d.grass1;ctx.fillRect(0,horizon,W,bottom-horizon);
 const grassPattern=(dcGrass.complete&&dcGrass.naturalWidth)?ctx.createPattern(dcGrass,'repeat'):null;
 const slices=76;
 for(let i=slices;i>=1;i--){
  const p=i/slices,p0=(i-1)/slices;
  const y=lerp(horizon,bottom,Math.pow(p,.76)),y0=lerp(horizon,bottom,Math.pow(p0,.76));
  const a=proj(p,curve),b=proj(p0,curve);
  // REAL GRASS: clip texture strictly to the roadside wedges. Never draw over road or sky.
  if(grassPattern){
   ctx.save();
   ctx.globalAlpha=.92;
   ctx.fillStyle=grassPattern;

   // left verge
   ctx.beginPath();
   ctx.moveTo(0,y0);
   ctx.lineTo(b.center-b.half,y0);
   ctx.lineTo(a.center-a.half,y);
   ctx.lineTo(0,y);
   ctx.closePath();
   ctx.clip();
   ctx.fillRect(0,y0,W,Math.max(2,y-y0+2));
   ctx.restore();

   // right verge
   ctx.save();
   ctx.globalAlpha=.92;
   ctx.fillStyle=grassPattern;
   ctx.beginPath();
   ctx.moveTo(b.center+b.half,y0);
   ctx.lineTo(W,y0);
   ctx.lineTo(W,y);
   ctx.lineTo(a.center+a.half,y);
   ctx.closePath();
   ctx.clip();
   ctx.fillRect(0,y0,W,Math.max(2,y-y0+2));
   ctx.restore();
  } else {
   ctx.fillStyle=((i+Math.floor(state.pos/ROAD.segLen))%2)?d.grass1:d.grass2;
   ctx.beginPath();
   ctx.moveTo(0,y0);ctx.lineTo(b.center-b.half,y0);ctx.lineTo(a.center-a.half,y);ctx.lineTo(0,y);ctx.closePath();ctx.fill();
   ctx.beginPath();
   ctx.moveTo(b.center+b.half,y0);ctx.lineTo(W,y0);ctx.lineTo(W,y);ctx.lineTo(a.center+a.half,y);ctx.closePath();ctx.fill();
  }

  // shoulder
  const shoulder=a.half*1.10, shoulder0=b.half*1.10;
  ctx.fillStyle=((i+Math.floor(state.pos/ROAD.segLen))%2)?'#f5f5f5':d.edge;
  ctx.beginPath();ctx.moveTo(a.center-a.half,y);ctx.lineTo(a.center-shoulder,y);ctx.lineTo(b.center-shoulder0,y0);ctx.lineTo(b.center-b.half,y0);ctx.fill();
  ctx.beginPath();ctx.moveTo(a.center+a.half,y);ctx.lineTo(a.center+shoulder,y);ctx.lineTo(b.center+shoulder0,y0);ctx.lineTo(b.center+b.half,y0);ctx.fill();

  // asphalt
  ctx.fillStyle=((i+Math.floor(state.pos/ROAD.segLen))%2)?'#19171d':'#15141a';
  ctx.beginPath();ctx.moveTo(a.center-a.half,y);ctx.lineTo(a.center+a.half,y);ctx.lineTo(b.center+b.half,y0);ctx.lineTo(b.center-b.half,y0);ctx.fill();

  // center lane dashes and second-lane dashes
  if(((i+Math.floor(state.pos/ROAD.segLen))%8)<4){
   ctx.fillStyle='rgba(255,255,255,.78)';
   for(const lane of [-.33,.33]){
    const x=a.center+a.half*lane,x0=b.center+b.half*lane,w=Math.max(1,4*p);
    ctx.beginPath();ctx.moveTo(x-w,y);ctx.lineTo(x+w,y);ctx.lineTo(x0+w*.7,y0);ctx.lineTo(x0-w*.7,y0);ctx.fill();
   }
  }

  // road gloss
  if(i%9===0){ctx.strokeStyle='rgba(255,45,149,.05)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(a.center-a.half*.55,y);ctx.lineTo(a.center+a.half*.55,y);ctx.stroke()}
 }
 // edge neon
 let last=null;
 ctx.save();ctx.lineWidth=2;ctx.strokeStyle=d.edge;ctx.shadowColor=d.edge;ctx.shadowBlur=8;
 for(let i=1;i<=35;i++){let p=i/35,pr=proj(p,curve),y=lerp(horizon,bottom,Math.pow(p,.76));if(last){ctx.beginPath();ctx.moveTo(last.l,yLast);ctx.lineTo(pr.center-pr.half,y);ctx.stroke();ctx.beginPath();ctx.moveTo(last.r,yLast);ctx.lineTo(pr.center+pr.half,y);ctx.stroke()}last={l:pr.center-pr.half,r:pr.center+pr.half};var yLast=y}
 ctx.restore();

 // hero Death Circuit billboard on the far horizon
 {
  const hp=.26, hpr=proj(hp,curve), hy=lerp(horizon,bottom,Math.pow(hp,.76));
  billboard(hpr.center,hy-W*.014,.34,1);
 }

 // roadside props projected by repeating virtual objects
 const spacing=980,total=TRACK_LEN(),baseIndex=Math.floor(state.pos/spacing);
 for(let k=0;k<18;k++){
  const worldZ=(baseIndex+k)*spacing;
  let dist=worldZ-state.pos;while(dist<0)dist+=total;
  if(dist>ROAD.drawDistance*ROAD.segLen)continue;
  const p=1-dist/(ROAD.drawDistance*ROAD.segLen);
  if(p<=.02)continue;
  const pr=proj(Math.pow(p,.88),curve), y=lerp(horizon,bottom,Math.pow(p,.76));
  const side=((baseIndex+k)%2)?-1:1;
  const x=pr.center+side*(pr.half+W*(.035+.10*p));
  const sc=.18+p*1.05;
  const sel=(baseIndex+k)%8;
  if(sel===0||sel===4)billboard(x,y,sc*.92,(baseIndex+k)%dcBillboards.length);
  else if(sel===2)roadsideImage(dcChevron,x,y,sc*.76,105);
  else if(sel===6)roadsideImage(dcBarricade,x,y,sc*.72,130);
  else if(d.prop==='palm')palm(x,y,sc,side);
  else if(d.prop==='tank')tank(x,y,sc);
  else tower(x,y,sc);
 }
 // roadside reflector poles
 for(let k=0;k<22;k++){
  const p=k/22,yy=lerp(horizon,bottom,Math.pow(p,.78)),pr=proj(p,curve),s=2+8*p;
  if(k%2===0){ctx.fillStyle='#fff';ctx.fillRect(pr.center-pr.half-W*.018,yy-s*3,s*.5,s*3);ctx.fillStyle=d.edge;ctx.fillRect(pr.center-pr.half-W*.018,yy-s*3,s*.5,s*.8)}
 }
}

function spriteWorld(obj,isRival){
 const dist=wrapDist(obj.z);const max=ROAD.drawDistance*ROAD.segLen;if(dist<=0||dist>max)return;
 const p=1-dist/max,curve=roadCurve(),pr=proj(Math.pow(p,.88),curve),y=lerp(H*.40,H*.93,Math.pow(p,.76));
 const x=pr.center+obj.lane*pr.half*.82,scale=.15+p*.95;
 const im=isRival?rivalImgs[obj.kind]:trafficImgs[obj.kind];
 const w=(isRival?112:96)*scale,h=(isRival?65:56)*scale;
 ctx.save();ctx.globalAlpha=.30;ctx.fillStyle='#000';ctx.beginPath();ctx.ellipse(x,y+h*.22,w*.46,h*.18,0,0,Math.PI*2);ctx.fill();ctx.restore();
 if(im.complete&&im.naturalWidth)drawImg(im,x-w/2,y-h,w,h);
 else{ctx.fillStyle=isRival?'#ff2d95':'#39d7ff';ctx.fillRect(x-w/2,y-h,w,h)}
}

function player(){
 const boost=input.nitro&&state.nitro>0&&state.mode==='play';
 const im=boost?playerBoost:playerIdle;
 const w=clamp(W*.18,145,260),h=w*.54,x=W*.5-state.x*W*.12,y=H*.92-h;
 ctx.save();ctx.globalAlpha=.30;ctx.fillStyle='#000';ctx.beginPath();ctx.ellipse(x,y+h*.86,w*.42,h*.18,0,0,Math.PI*2);ctx.fill();ctx.restore();
 if(boost){ctx.save();ctx.globalCompositeOperation='screen';let g=ctx.createRadialGradient(x,y+h*.82,2,x,y+h*.82,w*.35);g.addColorStop(0,'rgba(138,255,43,.8)');g.addColorStop(.45,'rgba(57,215,255,.5)');g.addColorStop(1,'rgba(57,215,255,0)');ctx.fillStyle=g;ctx.fillRect(x-w*.45,y+h*.58,w*.9,h*.6);ctx.restore()}
 if(im.complete&&im.naturalWidth)drawImg(im,x-w/2,y,w,h); else{ctx.fillStyle='#ff2d95';ctx.fillRect(x-w/2,y,w,h)}
}

function speedFx(){
 const s=Math.max(0,(state.speed-120)/180)+(input.nitro?.45:0);
 if(s<=0)return;
 ctx.save();
 for(let i=0;i<34;i++){
  let y=(i*47+state.time*420)%(H*.86),side=i%2?-1:1,x=side<0?Math.random()*W*.18:W-Math.random()*W*.18;
  ctx.strokeStyle=i%3===0?'rgba(57,215,255,.35)':'rgba(255,45,149,.32)';ctx.lineWidth=1+s*3;
  ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+side*(18+s*52),y+4);ctx.stroke();
 }
 ctx.restore();
}
function drawTitle(){
 if(concept.complete&&concept.naturalWidth){drawImg(concept,0,0,W,H);ctx.fillStyle='rgba(0,0,0,.42)';ctx.fillRect(0,0,W,H)}
 else{sky(H*.44);ctx.fillStyle='#0b0910';ctx.fillRect(0,H*.44,W,H*.56)}
 glowText('TTD',W*.5,H*.24,Math.max(32,W*.055),'#8aff2b');
 glowText('DEATH CIRCUIT',W*.5,H*.34,Math.max(42,W*.074),'#ff2d95');
 ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font=`900 ${Math.max(12,W*.016)}px monospace`;ctx.fillText('TITAN CITY STREET RACING // NO BRAKES // NO REFUNDS',W*.5,H*.405);
 ctx.fillStyle='rgba(0,0,0,.72)';ctx.strokeStyle='rgba(138,255,43,.6)';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(W*.5-150,H*.56,300,58,16);ctx.fill();ctx.stroke();
 ctx.fillStyle='#8aff2b';ctx.font='900 18px monospace';ctx.fillText('PRESS START',W*.5,H*.595);
 ctx.fillStyle='#fff';ctx.font='900 10px monospace';ctx.fillText('THROTTLE // STEER // BRAKE-DRIFT // NITRO',W*.5,H*.66);
}
function drawFinish(){
 ctx.fillStyle='rgba(0,0,0,.72)';ctx.fillRect(0,0,W,H);
 glowText('CIRCUIT CLEARED',W*.5,H*.39,Math.max(38,W*.06),'#8aff2b');
 ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='900 18px monospace';ctx.fillText(`SCORE ${String(Math.round(state.score)).padStart(6,'0')}`,W*.5,H*.47);
 ctx.fillStyle='#ff2d95';ctx.font='900 12px monospace';ctx.fillText('TITAN CITY SURVIVED. BARELY.',W*.5,H*.53);
}

function update(dt){
 state.time+=dt;state.flash=Math.max(0,state.flash-dt);state.crash=Math.max(0,state.crash-dt);state.shake=Math.max(0,state.shake-dt*20);
 if(state.mode!=='play')return;
 const boost=input.nitro&&state.nitro>0;
 const accel=input.gas?(boost?122:78):0;
 const brake=input.brake?150:0;
 state.speed+= (accel-brake-14-state.speed*.018)*dt;
 state.speed=clamp(state.speed,0,boost?315:285);
 if(boost){state.nitro=Math.max(0,state.nitro-24*dt);state.score+=30*dt}else state.nitro=Math.min(100,state.nitro+4.5*dt);
 const steer=(input.right-input.left)*(0.46+state.speed/260);
 state.x+=steer*dt;
 if(input.brake&&Math.abs(steer)>0.1)state.x+=steer*dt*.55;
 state.x*=Math.pow(.985,dt*60);state.x=clamp(state.x,-1.15,1.15);
 state.pos+=state.speed*dt*17;
 const total=TRACK_LEN();
 if(state.pos>=total){
  state.pos-=total;state.lap++;
  checks.forEach(x=>x.passed=false);state.checkpoints=0;
  state.districtIndex=(state.districtIndex+1)%DISTRICTS.length;toast(DISTRICTS[state.districtIndex].name);
  if(state.lap>3){state.mode='finish';state.finish=true;return}
 }
 // checkpoints
 for(const cp of checks){
  const d=cp.z-state.pos;
  if(!cp.passed && d<120 && d>-260){cp.passed=true;state.checkpoints++;state.score+=250;state.flash=.16;toast(`CHECKPOINT ${state.checkpoints}/5`)}
 }
 // AI
 for(const r of rivals){r.z=(r.z+r.speed*dt*13)%total}
 for(const t of traffic){t.z=(t.z+t.speed*dt*13)%total}
 // collision zone
 const all=[...rivals,...traffic];
 for(const o of all){
  const dist=wrapDist(o.z);
  if(dist<360 && dist>20 && Math.abs(o.lane-state.x*.78)<.18 && state.crash<=0){
   state.speed*=.48;state.crash=.48;state.shake=14;state.score=Math.max(0,state.score-120);toast('MORTIS // CRASH APPROVED');
  }
 }
 state.score+=state.speed*dt*.14;
}

function render(){
 ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
 if(state.mode==='title'){drawTitle();syncHud();return}
 const shakeX=state.shake>0?(Math.random()-.5)*state.shake:0,shakeY=state.shake>0?(Math.random()-.5)*state.shake*.5:0;
 ctx.save();ctx.translate(shakeX,shakeY);
 const horizon=H*.40,bottom=H*.96,curve=roadCurve();
 sky(horizon);
 roadAndScenery(horizon,bottom,curve);
 [...traffic].sort((a,b)=>wrapDist(b.z)-wrapDist(a.z)).forEach(o=>spriteWorld(o,false));
 [...rivals].sort((a,b)=>wrapDist(b.z)-wrapDist(a.z)).forEach(o=>spriteWorld(o,true));
 speedFx();player();
 // atmosphere
 let fog=ctx.createLinearGradient(0,horizon*.75,0,horizon*1.25);fog.addColorStop(0,'rgba(255,255,255,0)');fog.addColorStop(1,'rgba(255,160,120,.08)');ctx.fillStyle=fog;ctx.fillRect(0,horizon*.72,W,horizon*.5);
 if(state.crash>0){ctx.fillStyle=`rgba(255,45,149,${state.crash*.28})`;ctx.fillRect(0,0,W,H)}
 if(state.flash>0){ctx.fillStyle=`rgba(255,229,59,${state.flash*.22})`;ctx.fillRect(0,0,W,H)}
 if(state.mode==='finish')drawFinish();
 ctx.restore();syncHud();
}
function syncHud(){
 document.getElementById('spd').textContent=Math.round(state.speed);
 document.getElementById('gear').textContent=clamp(Math.floor(state.speed/52)+1,1,6);
 document.getElementById('district').textContent=district().name;
 document.getElementById('check').textContent=`${state.checkpoints}/5`;
 document.getElementById('lap').textContent=`${Math.min(state.lap,3)}/3`;
 document.getElementById('score').textContent=String(Math.round(state.score)).padStart(6,'0');
 document.getElementById('nitroVal').textContent=Math.round(state.nitro);
 const positions=1+rivals.filter(r=>wrapDist(r.z)>TRACK_LEN()*.5).length;document.getElementById('racepos').textContent=`${clamp(positions,1,4)}/4`;
}

function reset(){
 Object.assign(state,{mode:'play',speed:0,pos:0,x:0,score:0,checkpoints:0,lap:1,nitro:100,combo:1,crash:0,flash:.15,finish:false,districtIndex:0,shake:0});
 seed();toast('VHS QUARTER // GO');
}
function bindHold(id,key){
 const el=document.getElementById(id),off=()=>{input[key]=0;el.classList.remove('active')};
 el.addEventListener('pointerdown',e=>{e.preventDefault();input[key]=1;el.classList.add('active');try{el.setPointerCapture(e.pointerId)}catch(_){}});
 ['pointerup','pointercancel','lostpointercapture'].forEach(t=>el.addEventListener(t,off));
}
bindHold('left','left');bindHold('right','right');bindHold('throttle','gas');bindHold('brake','brake');bindHold('nitro','nitro');
document.getElementById('start').addEventListener('pointerdown',e=>{e.preventDefault();reset()});
addEventListener('keydown',e=>{
 if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code))e.preventDefault();
 if(e.code==='ArrowLeft'||e.code==='KeyA')input.left=1;
 if(e.code==='ArrowRight'||e.code==='KeyD')input.right=1;
 if(e.code==='ArrowUp'||e.code==='KeyW')input.gas=1;
 if(e.code==='ArrowDown'||e.code==='KeyS'||e.code==='Space')input.brake=1;
 if(e.code==='ShiftLeft'||e.code==='ShiftRight'||e.code==='KeyN')input.nitro=1;
 if(e.code==='Enter')reset();
});
addEventListener('keyup',e=>{
 if(e.code==='ArrowLeft'||e.code==='KeyA')input.left=0;
 if(e.code==='ArrowRight'||e.code==='KeyD')input.right=0;
 if(e.code==='ArrowUp'||e.code==='KeyW')input.gas=0;
 if(e.code==='ArrowDown'||e.code==='KeyS'||e.code==='Space')input.brake=0;
 if(e.code==='ShiftLeft'||e.code==='ShiftRight'||e.code==='KeyN')input.nitro=0;
});

// simple synth
let ac=null,musicOn=false,musicTimer=null,step=0;
function tone(f,d=.12,type='square',g=.025){try{ac||=new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),ga=ac.createGain();o.type=type;o.frequency.value=f;ga.gain.value=g;ga.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.connect(ga);ga.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(_){}}
function tickMusic(){if(!musicOn)return;const bass=[55,55,65.4,49,73.4,65.4,55,49],lead=[220,261.6,329.6,293.7,392,329.6,261.6,220];tone(bass[step%8],.16,'sawtooth',.018);if(step%2===0)tone(lead[step%8],.08,'square',.012);step++;musicTimer=setTimeout(tickMusic,180)}
document.getElementById('music').addEventListener('pointerdown',e=>{e.preventDefault();musicOn=!musicOn;e.currentTarget.textContent=musicOn?'♫ SYNTH ON':'♫ SYNTH OFF';if(musicOn){tickMusic()}else clearTimeout(musicTimer)});

function loop(now){const dt=Math.min(.033,(now-state.last)/1000||0);state.last=now;update(dt);render();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
})();
</script>
